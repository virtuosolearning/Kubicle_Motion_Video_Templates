<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Summary</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&f[]=inter@700,800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0a0a;
      font-family: 'Satoshi', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    // ─────────────────────────────────────────────────────────────────────────
    // Easing + helpers (trimmed from animations.jsx)
    // ─────────────────────────────────────────────────────────────────────────
    const Easing = {
      linear:        t => t,
      easeOutQuad:   t => t * (2 - t),
      easeOutCubic:  t => 1 - Math.pow(1 - t, 3),
      easeInOutCubic:t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
      easeOutBack:   t => {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      },
    };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const animate = ({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeOutCubic }) => t => {
      if (t <= start) return from;
      if (t >= end)   return to;
      return from + (to - from) * ease((t - start) / (end - start));
    };

    const TimelineContext = React.createContext({ time: 0, duration: 10 });
    const useTime = () => React.useContext(TimelineContext).time;

    // ─────────────────────────────────────────────────────────────────────────
    // Stage: fits canvas to viewport, runs the RAF loop, drives a playhead
    // ─────────────────────────────────────────────────────────────────────────
    function Stage({ width = 1920, height = 1080, duration = 10, background = '#E6ECF2', children }) {
      const [time, setTime]       = React.useState(0);
      const [playing, setPlaying] = React.useState(true);
      const [scale, setScale]     = React.useState(1);
      const stageRef = React.useRef(null);
      const rafRef   = React.useRef(null);
      const lastTs   = React.useRef(null);

      React.useEffect(() => {
        const measure = () => {
          if (!stageRef.current) return;
          const w = stageRef.current.clientWidth;
          const h = stageRef.current.clientHeight - 52;
          setScale(Math.max(0.05, Math.min(w / width, h / height)));
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(stageRef.current);
        window.addEventListener('resize', measure);
        return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
      }, [width, height]);

      React.useEffect(() => {
        if (!playing) { lastTs.current = null; return; }
        const step = (ts) => {
          if (lastTs.current == null) lastTs.current = ts;
          const dt = (ts - lastTs.current) / 1000;
          lastTs.current = ts;
          setTime(t => {
            let next = t + dt;
            if (next >= duration) next = next % duration;
            return next;
          });
          rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
        return () => cancelAnimationFrame(rafRef.current);
      }, [playing, duration]);

      React.useEffect(() => {
        const onKey = (e) => {
          if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
          else if (e.code === 'ArrowLeft')  setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.code === 'ArrowRight') setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.key === '0') setTime(0);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [duration]);

      return (
        <div ref={stageRef} style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column',
          background: '#0a0a0a',
        }}>
          <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', minHeight: 0 }}>
            <div style={{
              width, height, background,
              position: 'relative',
              transform: `scale(${scale})`,
              transformOrigin: 'center',
              flexShrink: 0,
              boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
              overflow: 'hidden',
            }}>
              <TimelineContext.Provider value={{ time, duration }}>
                {children}
              </TimelineContext.Provider>
            </div>
          </div>
          <PlaybackBar
            time={time}
            duration={duration}
            playing={playing}
            onPlayPause={() => setPlaying(p => !p)}
            onReset={() => setTime(0)}
            onSeek={setTime}
          />
        </div>
      );
    }

    function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek }) {
      const trackRef = React.useRef(null);
      const [drag, setDrag] = React.useState(false);
      const pct = duration > 0 ? (time / duration) * 100 : 0;
      const fmt = (t) => {
        const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
        return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
      };
      const seek = (e) => {
        const r = trackRef.current.getBoundingClientRect();
        onSeek(clamp((e.clientX - r.left) / r.width, 0, 1) * duration);
      };
      React.useEffect(() => {
        if (!drag) return;
        const up = () => setDrag(false);
        const mv = (e) => seek(e);
        window.addEventListener('mouseup', up);
        window.addEventListener('mousemove', mv);
        return () => { window.removeEventListener('mouseup', up); window.removeEventListener('mousemove', mv); };
      }, [drag]);

      const btn = {
        width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6, color: '#f6f4ef', cursor: 'pointer', padding: 0,
      };
      const mono = 'ui-monospace, SFMono-Regular, monospace';

      return (
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12,
          padding: '8px 16px',
          background: 'rgba(20,20,20,0.92)',
          borderTop: '1px solid rgba(255,255,255,0.08)',
          width: '100%', maxWidth: 680, alignSelf: 'center',
          borderRadius: 8,
          color: '#f6f4ef', fontFamily: 'Inter, system-ui, sans-serif',
          userSelect: 'none', flexShrink: 0,
        }}>
          <button onClick={onReset} title="Return to start" style={btn}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
            </svg>
          </button>
          <button onClick={onPlayPause} title="Play/pause (space)" style={btn}>
            {playing ? (
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
                <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
              </svg>
            ) : (
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
              </svg>
            )}
          </button>
          <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'right' }}>{fmt(time)}</div>
          <div ref={trackRef} onMouseDown={(e) => { setDrag(true); seek(e); }} style={{ flex: 1, height: 22, position: 'relative', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
            <div style={{ position: 'absolute', left: 0, right: 0, height: 4, background: 'rgba(255,255,255,0.12)', borderRadius: 2 }}/>
            <div style={{ position: 'absolute', left: 0, width: `${pct}%`, height: 4, background: '#0496FF', borderRadius: 2 }}/>
            <div style={{ position: 'absolute', left: `${pct}%`, top: '50%', width: 12, height: 12, marginLeft: -6, marginTop: -6, background: '#fff', borderRadius: 6, boxShadow: '0 2px 4px rgba(0,0,0,0.4)' }}/>
          </div>
          <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, color: 'rgba(246,244,239,0.55)' }}>{fmt(duration)}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Scene
    //
    // Asset geometry (1920 × 1080):
    //   Course_Summary_Banner.png   — banner visible at (113, 0) → (534, 355)
    //   Course_Summary_Pill.png     — one pill visible at (605, 116) → (1785, 261)
    //
    // We render the full PNGs and translate them to place their visible region
    // at the desired spot. Transparent padding around the artwork means stacking
    // multiple copies causes no visible overlap outside the pill rectangle.
    // ─────────────────────────────────────────────────────────────────────────

    const PILL_ASSET_TOP  = 116;          // top-y of the pill inside the asset
    const PILL_HEIGHT     = 145;          // opaque pill height
    const FIRST_PILL_TOP  = 80;           // final y of pill 1 (80 top / 80 bottom = vertically centred)
    const ROW_PITCH       = 155;          // vertical gap between pill tops
    const TEXT_LEFT       = 790;          // x where pill text begins (right of icon box)

    const PILL_TOPS = [0, 1, 2, 3, 4, 5].map(i => FIRST_PILL_TOP + i * ROW_PITCH);
    // Cascade timing: each pill waits until the previous one has fully landed
    // AND held for 1.0s before it starts rolling out from underneath.
    // Banner 0.1–1.8s; pill motion 1.2s; dwell 1.0s → cycle = 2.2s
    const PILL_DUR    = 1.20;
    const PILL_DWELL  = 1.00;
    const PILL_STARTS = [1.80, 4.00, 6.20, 8.40, 10.60, 12.80];

    function Banner() {
      const t = useTime();
      const ty      = animate({ from: -400, to: 0, start: 0.10, end: 1.80, ease: Easing.easeOutCubic })(t);
      const opacity = animate({ from: 0,    to: 1, start: 0.10, end: 0.90 })(t);

      return (
        <img
          src="Assets/Course_Summary_Banner.png"
          alt=""
          style={{
            position: 'absolute',
            left: 0, top: 0,
            width: 1920, height: 1080,
            transform: `translateY(${ty}px)`,
            opacity,
            pointerEvents: 'none',
            zIndex: 100,
          }}
        />
      );
    }

    function Pill({ index, label, startTime, fromTop, toTop }) {
      const t = useTime();
      const p      = clamp((t - startTime) / PILL_DUR, 0, 1);
      const eased  = Easing.easeOutCubic(p);
      const currentTop = fromTop + (toTop - fromTop) * eased;
      const assetOffsetY = currentTop - PILL_ASSET_TOP;

      // Before this pill's entry begins, don't render it (so it doesn't flash at its fromTop
      // position before t=startTime — especially relevant for pill 1 at -160).
      if (t < startTime - 0.001) return null;

      // Earlier pills cover later pills: pill 0 on top, pill 5 underneath.
      const zIndex = 20 - index;

      return (
        <div style={{
          position: 'absolute', left: 0, top: 0, width: 1920, height: 1080,
          zIndex,
          pointerEvents: 'none',
        }}>
          {/* The one-pill PNG, translated so its pill row lands at currentTop */}
          <img
            src="Assets/Course_Summary_Pill.png"
            alt=""
            style={{
              position: 'absolute',
              left: 0, top: assetOffsetY,
              width: 1920, height: 1080,
              display: 'block',
            }}
          />
          {/* Text overlay — vertically centred on the pill at currentTop */}
          <div style={{
            position: 'absolute',
            left: TEXT_LEFT,
            top: currentTop,
            height: PILL_HEIGHT,
            display: 'flex', alignItems: 'center',
            fontFamily: "'Satoshi', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif",
            fontWeight: 700,
            fontSize: 37,
            color: '#000',
            letterSpacing: '-0.01em',
            whiteSpace: 'nowrap',
          }}>
            {label}
          </div>
        </div>
      );
    }

    function Scene() {
      return (
        <div style={{ position: 'absolute', inset: 0, background: '#E6ECF2', overflow: 'hidden' }}>
          {/* Pills — render in order 1…6; z-index handles the stacking */}
          {PILL_TOPS.map((top, i) => (
            <Pill
              key={i}
              index={i}
              label={`Paste Course Recap ${i + 1}`}
              startTime={PILL_STARTS[i]}
              fromTop={i === 0 ? -160 : PILL_TOPS[i - 1]}
              toTop={top}
            />
          ))}

          {/* Banner — slides down into top-left */}
          <Banner />
        </div>
      );
    }

    function App() {
      return (
        <Stage width={1920} height={1080} duration={15} background="#E6ECF2">
          <Scene />
        </Stage>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
