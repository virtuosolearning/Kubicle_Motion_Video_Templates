    function InlineSVG({ svg, style }) {
      return <div style={style} dangerouslySetInnerHTML={{ __html: svg }} />;
    }

    // ─── Easing + helpers ────────────────────────────────────────────────────
    const Easing = {
      linear:         t => t,
      easeOutQuad:    t => t * (2 - t),
      easeInOutQuad:  t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2,
      easeOutCubic:   t => 1 - Math.pow(1 - t, 3),
      easeInOutCubic: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
      easeInOutQuint: t => t < 0.5 ? 16*t*t*t*t*t : 1 - Math.pow(-2*t + 2, 5) / 2,
      easeOutBackSubtle: t => {
        const c1 = 1.10, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      },
    };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const animate = ({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) => t => {
      if (t <= start) return from;
      if (t >= end)   return to;
      return from + (to - from) * ease((t - start) / (end - start));
    };

    const TimelineContext = React.createContext({ time: 0, duration: 10 });
    const useTime = () => React.useContext(TimelineContext).time;

    // ─── Stage ───────────────────────────────────────────────────────────────
    function Stage({ width = 1920, height = 1080, duration = 10, background = '#E6ECF2', children }) {
      const [time, setTime]       = React.useState(0);
      const [playing, setPlaying] = React.useState(true);
      const [scale, setScale]     = React.useState(1);
      const stageRef = React.useRef(null);
      const rafRef   = React.useRef(null);
      const lastTs   = React.useRef(null);

      React.useEffect(() => {
        const measure = () => {
          if (!stageRef.current) return;
          const w = stageRef.current.clientWidth;
          const h = stageRef.current.clientHeight - 52;
          setScale(Math.max(0.05, Math.min(w / width, h / height)));
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(stageRef.current);
        window.addEventListener('resize', measure);
        return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
      }, [width, height]);

      React.useEffect(() => {
        if (!playing) { lastTs.current = null; return; }
        const step = (ts) => {
          if (lastTs.current == null) lastTs.current = ts;
          const dt = (ts - lastTs.current) / 1000;
          lastTs.current = ts;
          setTime(t => {
            let next = t + dt;
            if (next >= duration) next = next % duration;
            return next;
          });
          rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
        return () => cancelAnimationFrame(rafRef.current);
      }, [playing, duration]);

      React.useEffect(() => {
        const onKey = (e) => {
          if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
          else if (e.code === 'ArrowLeft')  setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.code === 'ArrowRight') setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.key === '0') setTime(0);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [duration]);

      return (
        <div ref={stageRef} style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', background: '#0a0a0a' }}>
          <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', minHeight: 0 }}>
            <div style={{ width, height, background, position: 'relative', transform: `scale(${scale})`, transformOrigin: 'center', flexShrink: 0, boxShadow: '0 20px 60px rgba(0,0,0,0.4)', overflow: 'hidden' }}>
              <TimelineContext.Provider value={{ time, duration }}>
                {children}
              </TimelineContext.Provider>
            </div>
          </div>
          <PlaybackBar time={time} duration={duration} playing={playing} onPlayPause={() => setPlaying(p => !p)} onReset={() => setTime(0)} onSeek={setTime} />
        </div>
      );
    }

    function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek }) {
      const trackRef = React.useRef(null);
      const [drag, setDrag] = React.useState(false);
      const pct = duration > 0 ? (time / duration) * 100 : 0;
      const fmt = (t) => {
        const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
        return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
      };
      const seek = (e) => {
        const r = trackRef.current.getBoundingClientRect();
        onSeek(clamp((e.clientX - r.left) / r.width, 0, 1) * duration);
      };
      React.useEffect(() => {
        if (!drag) return;
        const up = () => setDrag(false);
        const mv = (e) => seek(e);
        window.addEventListener('mouseup', up); window.addEventListener('mousemove', mv);
        return () => { window.removeEventListener('mouseup', up); window.removeEventListener('mousemove', mv); };
      }, [drag]);
      const btn = { width: 28, height: 28, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:6, color:'#f6f4ef', cursor:'pointer', padding:0 };
      const mono = 'ui-monospace, SFMono-Regular, monospace';
      return (
        <div style={{ display:'flex', alignItems:'center', gap:12, padding:'8px 16px', background:'rgba(20,20,20,0.92)', borderTop:'1px solid rgba(255,255,255,0.08)', width:'100%', maxWidth:680, alignSelf:'center', borderRadius:8, color:'#f6f4ef', fontFamily:'Inter,system-ui,sans-serif', userSelect:'none', flexShrink:0 }}>
          <button onClick={onReset} title="Return to start" style={btn}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/></svg>
          </button>
          <button onClick={onPlayPause} title="Play/pause (space)" style={btn}>
            {playing ? (<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>) : (<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>)}
          </button>
          <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, textAlign:'right' }}>{fmt(time)}</div>
          <div ref={trackRef} onMouseDown={(e)=>{setDrag(true);seek(e);}} style={{ flex:1, height:22, position:'relative', cursor:'pointer', display:'flex', alignItems:'center' }}>
            <div style={{ position:'absolute', left:0, right:0, height:4, background:'rgba(255,255,255,0.12)', borderRadius:2 }}/>
            <div style={{ position:'absolute', left:0, width:`${pct}%`, height:4, background:'#0496FF', borderRadius:2 }}/>
            <div style={{ position:'absolute', left:`${pct}%`, top:'50%', width:12, height:12, marginLeft:-6, marginTop:-6, background:'#fff', borderRadius:6, boxShadow:'0 2px 4px rgba(0,0,0,0.4)' }}/>
          </div>
          <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, color:'rgba(246,244,239,0.55)' }}>{fmt(duration)}</div>
        </div>
      );
    }

    // ─── Scene constants (measured directly from the supplied PNGs) ──────────
    const FONT_STACK = "'Satoshi', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif";

    // Hard-coded directly from the pixel-precise pill detection — both pills
    // run at full width (540 px) for y=808..866 with rounded ends above and
    // below. Centring against this exact bbox.
    //   Left  pill: x=156..695, y=803..893  → centre (425.5, 848)
    //   Right pill: x=1232..1771, y=803..893 → centre (1501.5, 848)
    const LEFT_PILL_X   = 156;
    const RIGHT_PILL_X  = 1232;
    const PILL_TOP_Y    = 803;
    const PILL_W        = 540;
    const PILL_H        = 91;

    const LEFT_FRAME_CX  = 425;
    const RIGHT_FRAME_CX = 1501;

    // Each frame's icon area sits above its pill — centre at (frame_cx, 540).
    const SIDE_ICON_CY   = 540;
    const SIDE_ICON_SIZE = 380;

    // Middle_Base.png solid bbox: x=777..1148, y=270..949 (centre 962, 609).
    const MIDDLE_CX = 962;
    const MIDDLE_CY = 609;
    const LINK_ICON_SIZE = 220;

    // ─── Animation timings (10 s total, smooth easeInOut throughout) ─────────
    // Phase 1a (0.0 – 2.0s): the platinum-blue Stage backdrop is already on
    // screen; BG.png scales up from 0 → 1 from the centre.
    const BG_START   = 0.00;
    const BG_END     = 2.00;

    // Phase 1b (1.20 – 2.90s): the centre Connector (Middle_Base + link icon)
    // scales 0 → 1 AND rotates −180° → 0° in lockstep — both driven by the
    // same eased progress so the rotation runs throughout the scale. Delayed
    // ~1s after the BG begins so the backdrop establishes itself first.
    const CONN_START = 1.20;
    const CONN_END   = 2.90;

    // Phase 2 (1.00 – 5.50s): side frames begin sliding in much earlier so
    // the motion overlaps Phase 1 — the BG is still scaling and the centre
    // connector is mid-rotation as the sides start drifting in from the
    // edges. 4.5-second slide gives a long, near-linear motion across the
    // full window. Pill text fades in at the very end of the slide.
    const SIDES_START      = 1.00;
    const SIDES_END        = 5.50;
    const PILL_TEXT_START  = 4.50;
    const PILL_TEXT_END    = 5.50;

    // Phase 3 (3.0 – 10.0s): static composition.

    // ─── Background (BG.png scales 0→1 from the centre, on top of the
    // Platinum Blue stage backdrop) ──────────────────────────────────────────
    function Background({ time }) {
      const s = animate({
        from: 0, to: 1.0,
        start: BG_START, end: BG_END,
        ease: Easing.easeInOutCubic,
      })(time);
      return (
        <img src="Assets/BG.png" alt=""
             style={{
               position: 'absolute', inset: 0,
               width: '100%', height: '100%', display: 'block',
               transform: `scale(${s})`,
               transformOrigin: 'center center',
             }} />
      );
    }

    // ─── Centre connector (Middle_Base + link icon, scale + 180° rotate) ─────
    // Scale and rotation are driven by the SAME eased progress, so the
    // rectangle rotates as it scales — not "scale then rotate".
    function Connector({ time }) {
      const prog  = clamp((time - CONN_START) / (CONN_END - CONN_START), 0, 1);
      const eased = Easing.easeInOutCubic(prog);
      const scale = eased;
      const rotation = -180 + eased * 180;

      return (
        <div style={{
          position: 'absolute', inset: 0,
          transform: `rotate(${rotation}deg) scale(${scale})`,
          transformOrigin: `${MIDDLE_CX}px ${MIDDLE_CY}px`,
          opacity: prog > 0 ? 1 : 0,
          pointerEvents: 'none',
        }}>
          <img src="Assets/Middle_Base.png" alt=""
               style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block' }} />
          <div style={{
            position: 'absolute',
            left: MIDDLE_CX - LINK_ICON_SIZE / 2,
            top:  MIDDLE_CY - LINK_ICON_SIZE / 2,
            width: LINK_ICON_SIZE, height: LINK_ICON_SIZE,
          }}>
            <InlineSVG svg={ICON_LINK_SVG} style={{ width: '100%', height: '100%' }} />
          </div>
        </div>
      );
    }

    // ─── Side frame (shell + icon + pill text, slides in) ────────────────────
    function SideFrame({ time, side, shellAsset, iconSvg, pillText }) {
      const isLeft = side === 'left';
      const travelFrom = isLeft ? -1300 : 1300;
      const slideX = animate({
        from: travelFrom, to: 0,
        start: SIDES_START, end: SIDES_END,
        ease: Easing.easeInOutQuad,          // gentle near-linear motion so
                                             // the slide is visible across the
                                             // whole window, not bunched in
                                             // the middle like quint
      })(time);
      const op = animate({
        from: 0, to: 1,
        start: SIDES_START, end: SIDES_START + 0.50,
        ease: Easing.easeInOutCubic,
      })(time);
      const textOp = animate({
        from: 0, to: 1,
        start: PILL_TEXT_START, end: PILL_TEXT_END,
        ease: Easing.easeInOutCubic,
      })(time);

      const frameCX = isLeft ? LEFT_FRAME_CX : RIGHT_FRAME_CX;
      const pillX   = isLeft ? LEFT_PILL_X   : RIGHT_PILL_X;

      return (
        <div style={{
          position: 'absolute', inset: 0,
          transform: `translateX(${slideX}px)`,
          opacity: op,
          pointerEvents: 'none',
        }}>
          {/* Outlined shell (with footer pill baked in) */}
          <img src={shellAsset} alt=""
               style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block' }} />

          {/* Library icon, centred above the pill */}
          <div style={{
            position: 'absolute',
            left: frameCX - SIDE_ICON_SIZE / 2,
            top:  SIDE_ICON_CY - SIDE_ICON_SIZE / 2,
            width: SIDE_ICON_SIZE, height: SIDE_ICON_SIZE,
          }}>
            <InlineSVG svg={iconSvg} style={{ width: '100%', height: '100%' }} />
          </div>

          {/* Pill text — flex-centred wrapper sized to the pill's bbox; the
              inner span uses `lineHeight: 1` so the line box hugs the glyphs
              and flex centres the glyph block exactly in the pill. */}
          <div style={{
            position: 'absolute',
            left: pillX, top: PILL_TOP_Y,
            width: PILL_W, height: PILL_H,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            opacity: textOp,
            pointerEvents: 'none',
          }}>
            <span style={{
              color: '#FFFFFF',
              fontFamily: FONT_STACK,
              fontWeight: 700,                 // Satoshi Bold
              fontSize: 37,
              lineHeight: 1,
              letterSpacing: '-0.005em',
              whiteSpace: 'nowrap',
              display: 'inline-block',
              transform: 'translateY(-8px)',   // shift up — the previous ±2px
                                               // optical correction wasn't
                                               // visible in a 91px container
            }}>
              {pillText}
            </span>
          </div>
        </div>
      );
    }

    // ─── Scene ───────────────────────────────────────────────────────────────
    function Scene() {
      const t = useTime();
      return (
        <div style={{ position: 'absolute', inset: 0, background: '#E6ECF2', overflow: 'hidden' }}>
          {/* Phase 1: BG scales up + centre connector rotates in */}
          <Background time={t} />
          <Connector  time={t} />

          {/* Phase 2: side frames slide in (rendered after the connector so
              they overlap with it during the slide-in if necessary). */}
          <SideFrame
            time={t}
            side="left"
            shellAsset="Assets/Left_Shell_Box.png"
            iconSvg={ICON_VOCAB_SVG}
            pillText="Paste Icon Title 1"
          />
          <SideFrame
            time={t}
            side="right"
            shellAsset="Assets/Right_Shell_Box.png"
            iconSvg={ICON_STRONG_MIND_SVG}
            pillText="Paste Icon Title 2"
          />
        </div>
      );
    }

    function App() {
      return (
        <Stage width={1920} height={1080} duration={10} background="#E6ECF2">
          <Scene />
        </Stage>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
