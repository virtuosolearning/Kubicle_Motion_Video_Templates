<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lesson Title Screen</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #root { position: absolute; inset: 0; }
    input[type=range] { accent-color: #1B9EE0; width: 100%; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: #111; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
// ─── Inlined from animations.jsx ───────────────────────────────────────────
// (Browsers block <script src="*.jsx"> fetched over file://, so we keep the
// runtime in the page itself — this file works on a double-click.)

const Easing = {
  linear: (t) => t,

  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });
const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null,
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render,
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}

function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44;
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(p => !p);
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      <div style={{
        flex: 1,
        width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        minHeight: 0,
      }}>
        <div
          ref={canvasRef}
          style={{
            width, height,
            background,
            position: 'relative',
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            overflow: 'hidden',
          }}
        >
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>

      <PlaybackBar
        time={displayTime}
        actualTime={time}
        duration={duration}
        playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => { setTime(0); }}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) onSeek(t); else onHover(t);
  };

  const onTrackLeave = () => { if (!dragging) onHover(null); };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%', maxWidth: 680,
      alignSelf: 'center',
      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      <div style={{
        fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right', color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1, height: 22,
          position: 'relative', cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{ position: 'absolute', left: 0, right: 0, height: 4, background: 'rgba(255,255,255,0.12)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: 0, width: `${pct}%`, height: 4, background: 'oklch(72% 0.12 250)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: `${pct}%`, top: '50%', width: 12, height: 12, marginLeft: -6, marginTop: -6, background: '#fff', borderRadius: 6, boxShadow: '0 2px 4px rgba(0,0,0,0.4)' }}/>
      </div>

      <div style={{
        fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'left', color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      onClick={onClick}
      title={title}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6,
        color: '#f6f4ef',
        cursor: 'pointer', padding: 0,
        transition: 'background 120ms',
      }}
    >
      {children}
    </button>
  );
}

// Expose to the next <script type="text/babel"> block — Babel-standalone runs
// each block in its own scope, so const declarations don't leak otherwise.
Object.assign(window, {
  Easing, interpolate, animate, clamp,
  TimelineContext, useTime, useTimeline,
  Sprite, SpriteContext, useSprite,
  TextSprite, ImageSprite, RectSprite,
  Stage, PlaybackBar,
});
  </script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "courseTitle": "Paste Course Title",
  "lessonLabel": "Lesson One",
  "lessonTitle": "Paste Lesson Title",
  "accentColor": "#0794fd",
  "titleColor": "#ffffff",
  "bgOpacity": 1,
  "logoAreaX": 77,
  "logoAreaY": 58,
  "logoIconSize": 52,
  "logoScale": 1.25,
  "labelX": 59,
  "labelY": 390,
  "labelSize": 32,
  "titleX": 58,
  "titleY": 432,
  "titleSize": 78,
  "badgeRight": 76,
  "badgeBottom": 80,
  "badgeSize": 116,
  "showBadge": true,
  "animSpeed": 1,
  "flashDuration": 0,
  "logoDelay": 0,
  "labelDelay": 0.85,
  "titleDelay": 1.1,
  "badgeDelay": 1.3,
  "entryDistance": 28,
  "entryEase": "easeOutCubic"
}/*EDITMODE-END*/;

// Extract non-transparent bounding region from an image using canvas
async function extractIconFromPNG(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, c.width, c.height).data;
        let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
        for (let y = 0; y < c.height; y++) {
          for (let x = 0; x < c.width; x++) {
            if (data[(y * c.width + x) * 4 + 3] > 40) {
              if (x < minX) minX = x; if (y < minY) minY = y;
              if (x > maxX) maxX = x; if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX <= minX || maxY <= minY) { resolve(null); return; }
        const pad = 2;
        minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
        maxX = Math.min(c.width - 1, maxX + pad); maxY = Math.min(c.height - 1, maxY + pad);
        const w = maxX - minX + 1, h = maxY - minY + 1;
        const out = document.createElement('canvas');
        out.width = w; out.height = h;
        out.getContext('2d').drawImage(img, -minX, -minY);
        resolve(out.toDataURL('image/png'));
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

// ─── Image drop/upload zone ───────────────────────────────────────────────────
function ImageDropZone({ storageKey, label, currentSrc, onUpdate, placeholder }) {
  const [drag, setDrag] = React.useState(false);
  const ref = React.useRef();
  const read = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = e => { try { localStorage.setItem(storageKey, e.target.result); } catch {} onUpdate(e.target.result); };
    r.readAsDataURL(file);
  };
  return (
    <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);read(e.dataTransfer.files[0]);}}
      onClick={()=>ref.current.click()}
      style={{ border:`1.5px dashed ${drag?'#1B9EE0':'#3a3a3a'}`, borderRadius:6, padding:'8px 10px',
        cursor:'pointer', display:'flex', alignItems:'center', gap:10,
        background:drag?'rgba(27,158,224,0.07)':'rgba(255,255,255,0.02)', transition:'all 0.12s' }}>
      <input ref={ref} type="file" accept="image/*" style={{display:'none'}} onChange={e=>read(e.target.files[0])} />
      {currentSrc
        ? <img src={currentSrc} style={{ height:36, width:36, objectFit:'contain', background:'rgba(255,255,255,0.06)', borderRadius:4 }} />
        : <div style={{ width:36, height:36, background:'#1a1a1a', borderRadius:4, display:'flex', alignItems:'center', justifyContent:'center', color:'#444', fontSize:20 }}>+</div>}
      <div style={{ fontSize:11, color:'#777', lineHeight:1.5 }}>
        <div style={{color:'#bbb',marginBottom:1}}>{label}</div>
        <div style={{color:'#555'}}>Click or drag & drop PNG / SVG</div>
      </div>
    </div>
  );
}

// ─── Tweaks Panel ─────────────────────────────────────────────────────────────
function TweaksPanel({ tweaks, onChange, visible, courseIcon, onCourseIconChange }) {
  if (!visible) return null;

  const F = ({ label, k, type, min, max, step=1, opts }) => (
    <div style={{ marginBottom:9 }}>
      <label style={{ display:'block', fontSize:10, color:'#555', textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:2 }}>{label}</label>
      {type==='text' && <input value={tweaks[k]} onChange={e=>onChange(k,e.target.value)}
        style={{ width:'100%', background:'#111', border:'1px solid #222', borderRadius:4, color:'#fff', padding:'4px 8px', fontSize:12, fontFamily:'Inter,sans-serif' }} />}
      {type==='color' && <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <input type="color" value={tweaks[k]} onChange={e=>onChange(k,e.target.value)}
          style={{ width:28,height:24,border:'none',borderRadius:3,cursor:'pointer',background:'none',padding:0 }} />
        <span style={{color:'#666',fontSize:11,fontFamily:'monospace'}}>{tweaks[k]}</span>
      </div>}
      {type==='range' && <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <input type="range" min={min} max={max} step={step} value={tweaks[k]} onChange={e=>onChange(k,parseFloat(e.target.value))} />
        <span style={{color:'#ccc',fontSize:11,width:38,textAlign:'right',flexShrink:0,fontFamily:'monospace'}}>{Number(tweaks[k]).toFixed(step<0.1?2:step<1?1:0)}</span>
      </div>}
      {type==='toggle' && <button onClick={()=>onChange(k,!tweaks[k])}
        style={{background:tweaks[k]?'#1B9EE0':'#2a2a2a',border:'1px solid #333',borderRadius:10,padding:'2px 10px',color:'#fff',fontSize:11,cursor:'pointer',minWidth:48}}>
        {tweaks[k]?'ON':'OFF'}</button>}
      {type==='select' && <select value={tweaks[k]} onChange={e=>onChange(k,e.target.value)}
        style={{width:'100%',background:'#111',border:'1px solid #222',borderRadius:4,color:'#fff',padding:'4px 7px',fontSize:11}}>
        {opts.map(o=><option key={o} value={o}>{o}</option>)}</select>}
    </div>
  );

  const Sec = ({label}) => <div style={{color:'#444',fontSize:9,textTransform:'uppercase',letterSpacing:'0.1em',
    marginBottom:8,marginTop:14,borderTop:'1px solid #181818',paddingTop:10}}>{label}</div>;

  return (
    <div style={{
      position:'fixed', bottom:58, right:12, width:272,
      background:'rgba(8,8,8,0.97)', border:'1px solid #1c1c1c',
      borderRadius:10, padding:'14px 14px 12px', zIndex:9999,
      boxShadow:'0 16px 48px rgba(0,0,0,0.8)',
      maxHeight:'calc(100vh - 76px)', overflowY:'auto',
      fontFamily:'Inter,system-ui,sans-serif',
    }}>
      <div style={{color:'#fff',fontWeight:700,fontSize:13,marginBottom:14,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span>Tweaks</span>
        <button onClick={()=>{
          try{localStorage.removeItem('kubicle-tweaks');}catch{}
          window.location.reload();
        }} style={{fontSize:10,color:'#666',background:'none',border:'1px solid #2a2a2a',borderRadius:4,padding:'2px 8px',cursor:'pointer'}}>Reset</button>
      </div>

      <Sec label="Content" />
      <F label="Course Title" k="courseTitle" type="text" />
      <F label="Lesson Label" k="lessonLabel" type="text" />
      <F label="Lesson Title" k="lessonTitle" type="text" />

      <Sec label="Course Icon (top-left)" />
      <ImageDropZone storageKey="courseIcon" label="Course icon" currentSrc={courseIcon} onUpdate={onCourseIconChange} />
      <div style={{height:6}} />
      <F label="Icon + Text Scale" k="logoScale" type="range" min={0.4} max={3} step={0.05} />
      <F label="Icon Display Size (px)" k="logoIconSize" type="range" min={16} max={160} step={1} />
      <F label="Position X (px)" k="logoAreaX" type="range" min={0} max={500} step={1} />
      <F label="Position Y (px)" k="logoAreaY" type="range" min={0} max={400} step={1} />


      <Sec label="Bottom-Right Badge" />
<F label="Show Badge" k="showBadge" type="toggle" />
      <F label="Size (px)" k="badgeSize" type="range" min={20} max={200} step={1} />
      <F label="Right offset (px)" k="badgeRight" type="range" min={0} max={400} step={1} />
      <F label="Bottom offset (px)" k="badgeBottom" type="range" min={0} max={400} step={1} />

      <Sec label="Colors" />
      <F label="Accent Color" k="accentColor" type="color" />
      <F label="Title Text Color" k="titleColor" type="color" />
      <F label="Background Opacity" k="bgOpacity" type="range" min={0} max={1} step={0.05} />

      <Sec label="Lesson Label" />
      <F label="Font Size (px)" k="labelSize" type="range" min={12} max={100} step={1} />
      <F label="Position X (px)" k="labelX" type="range" min={0} max={960} step={1} />
      <F label="Position Y (px)" k="labelY" type="range" min={0} max={1080} step={1} />

      <Sec label="Lesson Title" />
      <F label="Font Size (px)" k="titleSize" type="range" min={24} max={180} step={1} />
      <F label="Position X (px)" k="titleX" type="range" min={0} max={960} step={1} />
      <F label="Position Y (px)" k="titleY" type="range" min={0} max={1080} step={1} />

      <Sec label="Animation" />
      <F label="Playback Speed" k="animSpeed" type="range" min={0.1} max={3} step={0.05} />
      <F label="White Flash Duration (s)" k="flashDuration" type="range" min={0.1} max={2} step={0.05} />
      <F label="Logo Entry Delay (s)" k="logoDelay" type="range" min={0} max={4} step={0.05} />
      <F label="Label Entry Delay (s)" k="labelDelay" type="range" min={0} max={4} step={0.05} />
      <F label="Title Entry Delay (s)" k="titleDelay" type="range" min={0} max={4} step={0.05} />
      <F label="Badge Entry Delay (s)" k="badgeDelay" type="range" min={0} max={4} step={0.05} />
      <F label="Entry Slide Distance (px)" k="entryDistance" type="range" min={0} max={120} step={1} />
      <F label="Easing" k="entryEase" type="select" opts={['easeOutCubic','easeOutQuart','easeOutExpo','easeOutBack','easeInOutCubic','linear']} />
    </div>
  );
}

// ─── Scene ────────────────────────────────────────────────────────────────────
function TitleScene({ tweaks, courseIcon }) {
  const t = useTime();
  const st = t * tweaks.animSpeed;
  const easeFn = Easing[tweaks.entryEase] || Easing.easeOutCubic;
  const dist = tweaks.entryDistance;

  const flashOp = tweaks.flashDuration > 0 ? animate({ from:1, to:0, start:0, end:tweaks.flashDuration, ease:Easing.easeInOutCubic })(st) : 0;
  const bgOp    = tweaks.flashDuration > 0 ? animate({ from:0, to:tweaks.bgOpacity, start:0.05, end:tweaks.flashDuration*0.75, ease:Easing.easeOutCubic })(st) : tweaks.bgOpacity;

  const logoOp   = Easing.easeOutCubic(clamp((st - tweaks.logoDelay) / 0.6, 0, 1));
  const logoOffY = (1 - logoOp) * (-dist * 0.5);
  const labelOp  = easeFn(clamp((st - tweaks.labelDelay) / 0.5, 0, 1));
  const labelX   = (1 - labelOp) * (-dist);
  const titleOp  = easeFn(clamp((st - tweaks.titleDelay) / 0.6, 0, 1));
  const titleX   = (1 - titleOp) * (-dist * 1.3);
  const badgeOp  = Easing.easeOutCubic(clamp((st - tweaks.badgeDelay) / 0.5, 0, 1));
  const badgeSc  = 0.65 + 0.35 * Easing.easeOutBack(clamp((st - tweaks.badgeDelay) / 0.5, 0, 1));

  const iconH = Math.round(tweaks.logoIconSize * tweaks.logoScale);

  // Derive hue from accentColor hex for CSS filter tinting
  const hexToHue = (hex) => {
    const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
    if (d === 0) return 0;
    let h = max === r ? (g-b)/d % 6 : max === g ? (b-r)/d + 2 : (r-g)/d + 4;
    return Math.round(h * 60 + (h < 0 ? 360 : 0));
  };
  const accentHue = hexToHue(tweaks.accentColor || '#1B9EE0');

  return (
    <>
      {/* Background */}
      <div style={{ position:'absolute', inset:0, opacity:bgOp }}>
        <img src="assets/Background.png" alt="" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />
      </div>

      

      {/* Course logo — CSS background crop from Logo.png at the correct natural position.
          When user uploads a custom icon, show that instead. */}
      <div style={{
        position:'absolute', top:tweaks.logoAreaY, left:tweaks.logoAreaX,
        display:'flex', alignItems:'center', gap:Math.round(11 * tweaks.logoScale),
        opacity:logoOp, transform:`translateY(${logoOffY}px)`, willChange:'transform,opacity',
      }}>
        {courseIcon ? (
          <div style={{
            width:iconH, height:iconH, flexShrink:0,
            WebkitMaskImage:`url(${courseIcon})`,
            WebkitMaskSize:'contain',
            WebkitMaskRepeat:'no-repeat',
            WebkitMaskPosition:'center',
            maskImage:`url(${courseIcon})`,
            maskSize:'contain',
            maskRepeat:'no-repeat',
            maskPosition:'center',
            background: tweaks.accentColor,
          }} />
        ) : (
          /* Placeholder — upload course icon via Tweaks */
          <div style={{
            width:iconH, height:iconH, flexShrink:0, borderRadius:4,
            border:`1.5px dashed ${tweaks.accentColor}`,
            display:'flex', alignItems:'center', justifyContent:'center',
            color:tweaks.accentColor, fontSize:Math.round(iconH*0.45), fontWeight:700,
          }}>+</div>
        )}
        <span style={{
          fontFamily:'Inter,system-ui,sans-serif',
          fontSize:Math.round(22 * tweaks.logoScale),
          fontWeight:600,
          letterSpacing:'-0.01em', whiteSpace:'nowrap', color:'#ffffff',
        }}>{tweaks.courseTitle}</span>
      </div>

      {/* Lesson label */}
      <div style={{
        position:'absolute', top:tweaks.labelY, left:tweaks.labelX,
        opacity:labelOp, transform:`translateX(${labelX}px)`, willChange:'transform,opacity',
      }}>
        <span style={{
          fontFamily:'Inter,system-ui,sans-serif', fontSize:tweaks.labelSize,
          fontWeight:700, color:tweaks.accentColor, letterSpacing:'0.01em',
        }}>{tweaks.lessonLabel}</span>
      </div>

      {/* Lesson title */}
      <div style={{
        position:'absolute', top:tweaks.titleY, left:tweaks.titleX,
        opacity:titleOp, transform:`translateX(${titleX}px)`, willChange:'transform,opacity',
      }}>
        <span style={{
          fontFamily:'Inter,system-ui,sans-serif', fontSize:tweaks.titleSize,
          fontWeight:800, color:tweaks.titleColor, letterSpacing:'-0.025em', lineHeight:1.05,
        }}>{tweaks.lessonTitle}</span>
      </div>

      {/* Bottom-right badge — uses uploaded badgeIcon or Logo.png crop */}
      {tweaks.showBadge && (
        <div style={{
          position:'absolute', bottom:tweaks.badgeBottom, right:tweaks.badgeRight,
          opacity:badgeOp, transform:`scale(${badgeSc})`, transformOrigin:'bottom right',
          willChange:'transform,opacity',
          width:tweaks.badgeSize, height:tweaks.badgeSize,
          overflow:'hidden', borderRadius: Math.round(tweaks.badgeSize * 0.14),
        }}>
          <img src="assets/Logo.png" alt="badge" style={{
              position:'absolute',
              width: Math.round(1920 * tweaks.badgeSize / 101),
              height: Math.round(1080 * tweaks.badgeSize / 101),
              top: -Math.round(854 * tweaks.badgeSize / 101),
              left: -Math.round(1695 * tweaks.badgeSize / 101),
              display:'block',
            }} />
        </div>
      )}
    </>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = React.useState(() => {
    try { const s = JSON.parse(localStorage.getItem('kubicle-tweaks')||'{}'); return {...TWEAK_DEFAULTS,...s}; }
    catch { return TWEAK_DEFAULTS; }
  });
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  // User-uploaded overrides
  const [courseIconOverride, setCourseIconOverride] = React.useState(() => { try { return localStorage.getItem('courseIcon')||null; } catch { return null; } });
  const courseIcon = courseIconOverride;

  const handleChange = (key, value) => {
    const next = { ...tweaks, [key]: value };
    setTweaks(next);
    try { localStorage.setItem('kubicle-tweaks', JSON.stringify(next)); } catch {}
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ [key]: value } }, '*');
  };

  React.useEffect(() => {
    try { localStorage.removeItem('badgeIcon'); } catch {}
  }, []);

  React.useEffect(() => {
    const handler = e => {
      if (e.data?.type==='__activate_edit_mode')   setTweaksVisible(true);
      if (e.data?.type==='__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      <Stage width={1920} height={1080} duration={10} background="#020d18" loop={true} autoplay={true} persistKey="kubicle-title">
        <TitleScene tweaks={tweaks} courseIcon={courseIcon} />
      </Stage>
      <TweaksPanel
        tweaks={tweaks} onChange={handleChange} visible={tweaksVisible}
        courseIcon={courseIcon} onCourseIconChange={setCourseIconOverride}

      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
