    const ICON_SVGS = [ICON_FOLDER_SVG, ICON_ANALYTICS_SVG, ICON_SUCCESS_SVG];

    function InlineSVG({ svg, style }) {
      return <div style={style} dangerouslySetInnerHTML={{ __html: svg }} />;
    }

    // ─── Easing + helpers ────────────────────────────────────────────────────
    const Easing = {
      linear:         t => t,
      easeOutQuad:    t => t * (2 - t),
      easeInOutQuad:  t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2,
      easeOutCubic:   t => 1 - Math.pow(1 - t, 3),
      easeInOutCubic: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
      easeInOutQuint: t => t < 0.5 ? 16*t*t*t*t*t : 1 - Math.pow(-2*t + 2, 5) / 2,
      // Subtle back ease for the "scales up with slight overshoot" card entrance.
      easeOutBackSubtle: t => {
        const c1 = 0.9, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      },
    };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const animate = ({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) => t => {
      if (t <= start) return from;
      if (t >= end)   return to;
      return from + (to - from) * ease((t - start) / (end - start));
    };

    const TimelineContext = React.createContext({ time: 0, duration: 10 });
    const useTime = () => React.useContext(TimelineContext).time;

    // ─── Stage ───────────────────────────────────────────────────────────────
    function Stage({ width = 1920, height = 1080, duration = 10, background = '#E6ECF2', children }) {
      const [time, setTime]       = React.useState(0);
      const [playing, setPlaying] = React.useState(true);
      const [scale, setScale]     = React.useState(1);
      const stageRef = React.useRef(null);
      const rafRef   = React.useRef(null);
      const lastTs   = React.useRef(null);

      React.useEffect(() => {
        const measure = () => {
          if (!stageRef.current) return;
          const w = stageRef.current.clientWidth;
          const h = stageRef.current.clientHeight - 52;
          setScale(Math.max(0.05, Math.min(w / width, h / height)));
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(stageRef.current);
        window.addEventListener('resize', measure);
        return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
      }, [width, height]);

      React.useEffect(() => {
        if (!playing) { lastTs.current = null; return; }
        const step = (ts) => {
          if (lastTs.current == null) lastTs.current = ts;
          const dt = (ts - lastTs.current) / 1000;
          lastTs.current = ts;
          setTime(t => {
            let next = t + dt;
            if (next >= duration) next = next % duration;
            return next;
          });
          rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
        return () => cancelAnimationFrame(rafRef.current);
      }, [playing, duration]);

      React.useEffect(() => {
        const onKey = (e) => {
          if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
          else if (e.code === 'ArrowLeft')  setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.code === 'ArrowRight') setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.key === '0') setTime(0);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [duration]);

      return (
        <div ref={stageRef} style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', background: '#0a0a0a' }}>
          <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', minHeight: 0 }}>
            <div style={{ width, height, background, position: 'relative', transform: `scale(${scale})`, transformOrigin: 'center', flexShrink: 0, boxShadow: '0 20px 60px rgba(0,0,0,0.4)', overflow: 'hidden' }}>
              <TimelineContext.Provider value={{ time, duration }}>
                {children}
              </TimelineContext.Provider>
            </div>
          </div>
          <PlaybackBar time={time} duration={duration} playing={playing} onPlayPause={() => setPlaying(p => !p)} onReset={() => setTime(0)} onSeek={setTime} />
        </div>
      );
    }

    function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek }) {
      const trackRef = React.useRef(null);
      const [drag, setDrag] = React.useState(false);
      const pct = duration > 0 ? (time / duration) * 100 : 0;
      const fmt = (t) => {
        const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
        return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
      };
      const seek = (e) => {
        const r = trackRef.current.getBoundingClientRect();
        onSeek(clamp((e.clientX - r.left) / r.width, 0, 1) * duration);
      };
      React.useEffect(() => {
        if (!drag) return;
        const up = () => setDrag(false);
        const mv = (e) => seek(e);
        window.addEventListener('mouseup', up); window.addEventListener('mousemove', mv);
        return () => { window.removeEventListener('mouseup', up); window.removeEventListener('mousemove', mv); };
      }, [drag]);
      const btn = { width: 28, height: 28, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:6, color:'#f6f4ef', cursor:'pointer', padding:0 };
      const mono = 'ui-monospace, SFMono-Regular, monospace';
      return (
        <div style={{ display:'flex', alignItems:'center', gap:12, padding:'8px 16px', background:'rgba(20,20,20,0.92)', borderTop:'1px solid rgba(255,255,255,0.08)', width:'100%', maxWidth:680, alignSelf:'center', borderRadius:8, color:'#f6f4ef', fontFamily:'Inter,system-ui,sans-serif', userSelect:'none', flexShrink:0 }}>
          <button onClick={onReset} title="Return to start" style={btn}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/></svg>
          </button>
          <button onClick={onPlayPause} title="Play/pause (space)" style={btn}>
            {playing ? (<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>) : (<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>)}
          </button>
          <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, textAlign:'right' }}>{fmt(time)}</div>
          <div ref={trackRef} onMouseDown={(e)=>{setDrag(true);seek(e);}} style={{ flex:1, height:22, position:'relative', cursor:'pointer', display:'flex', alignItems:'center' }}>
            <div style={{ position:'absolute', left:0, right:0, height:4, background:'rgba(255,255,255,0.12)', borderRadius:2 }}/>
            <div style={{ position:'absolute', left:0, width:`${pct}%`, height:4, background:'#0496FF', borderRadius:2 }}/>
            <div style={{ position:'absolute', left:`${pct}%`, top:'50%', width:12, height:12, marginLeft:-6, marginTop:-6, background:'#fff', borderRadius:6, boxShadow:'0 2px 4px rgba(0,0,0,0.4)' }}/>
          </div>
          <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, color:'rgba(246,244,239,0.55)' }}>{fmt(duration)}</div>
        </div>
      );
    }

    // ─── Scene constants (measured directly from the supplied PNGs) ──────────
    const TITLE_FONT = "'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif";
    const BODY_FONT  = "'Satoshi', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif";

    // Base_Container.png solid bbox: x=82..651 (centre 366), y=226..1027 (centre 626).
    const CARD_SRC_CX = 366;
    const CARD_SRC_CY = 626;

    // Pill_and_Sphere.png solid bbox: x=103..630 (centre 366), y=894..1010.
    // The blue sphere disc (using full-saturation extents) sits at x=124..207,
    // y=913..993 — centre (165, 953) — so the number container is sized to
    // those bounds and flex-centred for proper optical centring.
    const SPHERE_LEFT = 124;
    const SPHERE_TOP  = 913;
    const SPHERE_W    = 84;
    const SPHERE_H    = 81;

    // Final_Composition.png places the three card centres at these x positions
    // (measured from the rendered comp). The y position is shifted up by 80px
    // from the asset's own y centre.
    const CARD_FINAL_CXS = [356, 961, 1566];
    const CARD_OFFSET_Y  = -80;

    // ─── Animation timings (10s total) ───────────────────────────────────────
    // Each card runs the same internal beat. The next card starts 3s after
    // the previous, so the third finishes around 8.5s, leaving ~1.5s hold.
    const CARD_STARTS = [0.20, 3.30, 6.40];

    const CARD_SCALE_DUR  = 0.70;   // entrance scale (with subtle overshoot)
    const CARD_FADE_DUR   = 0.40;   // entrance opacity ramp
    const CONTENT_FADE_IN = 0.45;   // title + icon start fading in
    const CONTENT_FADE_END = 1.05;
    // Pill + sphere fade in as a single asset (no clip-path, no wipe — the
    // PNG already has its drop shadow baked in, so cropping it looks broken).
    const PILL_FADE_IN    = 1.05;
    const PILL_FADE_OUT   = 1.50;
    const TYPE_START      = 1.55;
    const TYPE_DUR        = 0.85;

    const TITLES = ['Title One', 'Title Two', 'Title Three'];
    const SUBTOPICS = [
      'Paste Subtopic example 1',
      'Paste Subtopic example 2',
      'Paste Subtopic example 3',
    ];

    // ─── A single pillar card ────────────────────────────────────────────────
    function Card({ index, time }) {
      const startT = CARD_STARTS[index];
      const t      = time - startT;

      // Card scale-in (subtle overshoot) + fade-in.
      const scaleProg   = clamp(t / CARD_SCALE_DUR, 0, 1);
      const cardScale   = scaleProg > 0 ? Easing.easeOutBackSubtle(scaleProg) : 0;
      const settledScale = t >= CARD_SCALE_DUR ? 1 : cardScale;
      const cardOpacity = clamp(t / CARD_FADE_DUR, 0, 1);

      // Title + icon fade together (after the card has mostly arrived).
      const contentOp = animate({
        from: 0, to: 1,
        start: CONTENT_FADE_IN, end: CONTENT_FADE_END,
        ease: Easing.easeInOutCubic,
      })(t);

      // Pill + sphere — single fade-in. Asset is rendered untouched so its
      // built-in drop shadow stays intact.
      const pillOp = animate({
        from: 0, to: 1,
        start: PILL_FADE_IN, end: PILL_FADE_OUT,
        ease: Easing.easeInOutCubic,
      })(t);

      // Number lines up with the pill fade — they belong together.
      const numberOp = pillOp;

      // Subtopic typewriter, post-pill expansion.
      const subText  = SUBTOPICS[index];
      const typeProg = clamp((t - TYPE_START) / TYPE_DUR, 0, 1);
      const charsShow = Math.floor(subText.length * typeProg);
      const visibleSub = subText.slice(0, charsShow);

      // Where this card sits in the final composition.
      const offsetX = CARD_FINAL_CXS[index] - CARD_SRC_CX;
      const offsetY = CARD_OFFSET_Y;

      return (
        <div style={{
          position: 'absolute', inset: 0,
          transform: `translate(${offsetX}px, ${offsetY}px) scale(${settledScale})`,
          transformOrigin: `${CARD_SRC_CX}px ${CARD_SRC_CY}px`,
          opacity: cardOpacity,
          pointerEvents: 'none',
        }}>
          {/* Blue gradient card */}
          <img src="Assets/Base_Container.png" alt=""
               style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block' }} />

          {/* Title */}
          <div style={{
            position: 'absolute',
            left: CARD_SRC_CX, top: 296,
            transform: 'translateX(-50%)',
            color: '#FFFFFF',
            fontFamily: TITLE_FONT,
            fontWeight: 800,                      // Inter ExtraBold
            fontSize: 55,
            letterSpacing: '-0.01em',
            whiteSpace: 'nowrap',
            opacity: contentOp,
          }}>
            {TITLES[index]}
          </div>

          {/* Icon — large white line art, centred between title and pill */}
          <div style={{
            position: 'absolute',
            left: CARD_SRC_CX - 200, top: 425,
            width: 400, height: 400,
            opacity: contentOp,
          }}>
            <InlineSVG svg={ICON_SVGS[index]} style={{ width: '100%', height: '100%' }} />
          </div>

          {/* Pill + sphere — asset used as-is, no clip or wipe so its
              baked-in drop shadow stays clean. */}
          <img src="Assets/Pill_and_Sphere.png" alt=""
               style={{
                 position: 'absolute', inset: 0,
                 width: '100%', height: '100%', display: 'block',
                 opacity: pillOp,
               }} />

          {/* Number inside the sphere — flex-centred container sized to the
              sphere's bbox so the digit lands optically in the middle of the
              circle regardless of font baseline. */}
          <div style={{
            position: 'absolute',
            left: SPHERE_LEFT, top: SPHERE_TOP,
            width: SPHERE_W, height: SPHERE_H,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            color: '#FFFFFF',
            fontFamily: TITLE_FONT,
            fontWeight: 800,                      // Inter ExtraBold
            fontSize: 38,
            lineHeight: 1,
            opacity: numberOp,
          }}>
            {index + 1}
          </div>

          {/* Subtopic text — typewriter, sits to the right of the sphere */}
          <div style={{
            position: 'absolute',
            left: 232, top: SPHERE_TOP + SPHERE_H / 2,
            transform: 'translateY(-50%)',
            width: 380,
            color: '#0B1E33',
            fontFamily: BODY_FONT,
            fontWeight: 500,                      // Satoshi medium
            fontSize: 33,
            letterSpacing: '-0.005em',
            whiteSpace: 'nowrap',
            opacity: t >= TYPE_START ? 1 : 0,
          }}>
            {visibleSub}
          </div>
        </div>
      );
    }

    // ─── Scene ───────────────────────────────────────────────────────────────
    function Scene() {
      const t = useTime();
      return (
        <div style={{ position: 'absolute', inset: 0, background: '#E6ECF2', overflow: 'hidden' }}>
          {[0, 1, 2].map(i => <Card key={i} index={i} time={t} />)}
        </div>
      );
    }

    function App() {
      return (
        <Stage width={1920} height={1080} duration={10} background="#E6ECF2">
          <Scene />
        </Stage>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
