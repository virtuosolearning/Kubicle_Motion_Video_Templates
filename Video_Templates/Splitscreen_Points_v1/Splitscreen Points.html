<script type="text/babel">
// ─── Inlined from animations.jsx ───────────────────────────────────────────
// (Browsers block <script src="*.jsx"> fetched over file://, so we keep the
// runtime in the page itself — this file works on a double-click.)

const Easing = {
  linear: (t) => t,

  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });
const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null,
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render,
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}

function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44;
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(p => !p);
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      <div style={{
        flex: 1,
        width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        minHeight: 0,
      }}>
        <div
          ref={canvasRef}
          style={{
            width, height,
            background,
            position: 'relative',
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            overflow: 'hidden',
          }}
        >
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>

      <PlaybackBar
        time={displayTime}
        actualTime={time}
        duration={duration}
        playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => { setTime(0); }}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) onSeek(t); else onHover(t);
  };

  const onTrackLeave = () => { if (!dragging) onHover(null); };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%', maxWidth: 680,
      alignSelf: 'center',
      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      <div style={{
        fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right', color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1, height: 22,
          position: 'relative', cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{ position: 'absolute', left: 0, right: 0, height: 4, background: 'rgba(255,255,255,0.12)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: 0, width: `${pct}%`, height: 4, background: 'oklch(72% 0.12 250)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: `${pct}%`, top: '50%', width: 12, height: 12, marginLeft: -6, marginTop: -6, background: '#fff', borderRadius: 6, boxShadow: '0 2px 4px rgba(0,0,0,0.4)' }}/>
      </div>

      <div style={{
        fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'left', color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      onClick={onClick}
      title={title}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6,
        color: '#f6f4ef',
        cursor: 'pointer', padding: 0,
        transition: 'background 120ms',
      }}
    >
      {children}
    </button>
  );
}

// Expose to the next <script type="text/babel"> block — Babel-standalone runs
// each block in its own scope, so const declarations don't leak otherwise.
Object.assign(window, {
  Easing, interpolate, animate, clamp,
  TimelineContext, useTime, useTimeline,
  Sprite, SpriteContext, useSprite,
  TextSprite, ImageSprite, RectSprite,
  Stage, PlaybackBar,
});
</script>

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

<body>
<div id="root"></div>
<script type="text/babel">

/* ── TWEAK DEFAULTS ─────────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "group1Title": "Group 1 (Subtitle paste):",
  "group2Title": "Group 2 (Subtitle paste):",
  "pill1": "Text 1",
  "pill2": "Text 2",
  "pill3": "Text 3",
  "pill4": "Text 4",
  "pill5": "Text 5",
  "pill6": "Text 6",
  "pill7": "Text 7",
  "pill8": "Text 8"
}/*EDITMODE-END*/;

/* ── ANIMATION CONSTANTS ────────────────────────────────────────────────── */
const LEFT_BLUE  = '#00B8EE';
const RIGHT_PINK = '#FF3D8A';

// Each row's start time (seconds)
const ROW_TIMES = [0.8, 1.8, 2.8, 3.8];
const TITLE_IN  = 0.25;

// Pill geometry from actual PNG bbox analysis (all at 1920×1080)
const PILL_W       = 693;   // maxX - minX = 849 - 156
const PILL_H       = 111;   // maxY - minY = 464 - 353
const CIRCLE_D     = 111;   // circle diameter = pill height
const LEFT_PILL_X  = 156;   // minX of left pill in PNG
const RIGHT_PILL_X = 1032;  // minX of right pill in PNG
const PILL_Y       = 353;   // minY of both pills in PNG
const ROW_STEP     = 133;   // pill height + gap

/* ── HELPERS ────────────────────────────────────────────────────────────── */
function av(t, s, e, ease) {
  ease = ease || Easing.easeOutExpo;
  if (t <= s) return 0;
  if (t >= e) return 1;
  return ease((t - s) / (e - s));
}

/* ── ANIMATED PILL (uses real PNG assets) ───────────────────────────────── */
function AnimPill({ t, startTime, side, text, icon, rowIndex }) {
  const isLeft    = side === 'left';
  const textColor = isLeft ? '#FFFFFF' : '#0C1A28';
  const pillSrc   = isLeft
    ? 'uploads/Splitscreen_Points_v1_template/Assets/Pill_1_left_side.png'
    : 'uploads/Splitscreen_Points_v1_template/Assets/Pill_1_right_side.png';
  const pillOriginX = isLeft ? LEFT_PILL_X : RIGHT_PILL_X;

  // Scale up from 0 → 1 with a bounce (easeOutBack), origin at left-centre (circle)
  const scaleAnim = av(t, startTime, startTime + 0.75, Easing.easeOutBack);
  // Text fades in slightly after the pill has popped in
  const textAnim  = av(t, startTime + 0.55, startTime + 0.85, Easing.easeOutQuad);

  // Position in the 1920×1080 stage
  const stageX = pillOriginX;
  const stageY = PILL_Y + rowIndex * ROW_STEP;

  return (
    <div style={{
      position: 'absolute',
      left: stageX,
      top: stageY,
      width: PILL_W,
      height: PILL_H,
      zIndex: 2,
      transform: `scale(${scaleAnim})`,
      transformOrigin: 'center center',
    }}>
      {/* ── The actual PNG pill asset, shifted so its pill region fills this container */}
      <img
        src={pillSrc}
        draggable={false}
        style={{
          position: 'absolute',
          top:  -PILL_Y,         // shift image up so pill top aligns with container top
          left: -pillOriginX,    // shift image left so pill left aligns with container left
          width:  1920,
          height: 1080,
          pointerEvents: 'none',
          userSelect: 'none',
        }}
      />

      {/* ── Icon overlay — sits on top of the circle in the PNG */}
      <div style={{
        position: 'absolute',
        left: 0,
        top: 0,
        width: CIRCLE_D,
        height: CIRCLE_D,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        zIndex: 3,
        pointerEvents: 'none',
      }}>
        {icon && (
          <div
            style={{ width: '58%', height: '58%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}
            dangerouslySetInnerHTML={{ __html: icon }}
          />
        )}
      </div>

      {/* ── Text overlay — fades in after body is extended */}
      <div style={{
        position: 'absolute',
        left: CIRCLE_D + 18,
        top: 0,
        height: PILL_H,
        display: 'flex',
        alignItems: 'center',
        opacity: textAnim,
        zIndex: 3,
        pointerEvents: 'none',
      }}>
        <span style={{
          fontFamily: 'Inter, sans-serif',
          fontWeight: 700,
          fontSize: 40,
          color: textColor,
          whiteSpace: 'nowrap',
          letterSpacing: '-0.3px',
        }}>
          {text}
        </span>
      </div>
    </div>
  );
}

/* ── GROUP TITLE ────────────────────────────────────────────────────────── */
function GroupTitle({ t, text, color }) {
  const opacity = av(t, TITLE_IN, TITLE_IN + 0.45, Easing.easeOutQuad);
  const ty      = (1 - av(t, TITLE_IN, TITLE_IN + 0.55, Easing.easeOutExpo)) * 28;
  return (
    <div style={{
      fontFamily: 'Satoshi, sans-serif',
      fontWeight: 900,
      fontSize: 58,
      color,
      opacity,
      transform: `translateY(${ty}px)`,
      marginBottom: 38,
      letterSpacing: '-0.5px',
      lineHeight: 1.1,
    }}>
      {text}
    </div>
  );
}

/* ── MAIN SCENE ─────────────────────────────────────────────────────────── */
function Scene({ config, icons }) {
  const t = useTime();

  const rootRef = React.useRef();
  React.useEffect(() => {
    if (rootRef.current) rootRef.current.setAttribute('data-screen-label', `${Math.floor(t)}s`);
  }, [Math.floor(t)]);

  const leftTexts  = ['pill1','pill2','pill3','pill4'].map(k => config[k]);
  const rightTexts = ['pill5','pill6','pill7','pill8'].map(k => config[k]);

  // Title Y: sit above the first pill (PILL_Y=353), with room for font + margin
  const TITLE_Y = 210;

  return (
    <div ref={rootRef} style={{ position: 'relative', width: '100%', height: '100%' }}>

      {/* ── Background: provided PNG asset */}
      <img
        src="uploads/Splitscreen_Points_v1_template/Assets/Oxfordblue_splitscreen_BG.png"
        alt=""
        draggable={false}
        style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'fill' }}
      />

      {/* ── Left title: aligned to left pill X */}
      <div style={{ position: 'absolute', left: LEFT_PILL_X, top: TITLE_Y, zIndex: 2 }}>
        <GroupTitle t={t} text={config.group1Title} color={LEFT_BLUE} />
      </div>

      {/* ── Right title: aligned to right pill X */}
      <div style={{ position: 'absolute', left: RIGHT_PILL_X, top: TITLE_Y, zIndex: 2 }}>
        <GroupTitle t={t} text={config.group2Title} color={RIGHT_PINK} />
      </div>

      {/* ── Left pills: each absolutely positioned using real PNG coords */}
      {leftTexts.map((text, i) => (
        <AnimPill
          key={i}
          t={t}
          startTime={ROW_TIMES[i]}
          side="left"
          text={text}
          icon={icons.left[i]}
          rowIndex={i}
        />
      ))}

      {/* ── Right pills */}
      {rightTexts.map((text, i) => (
        <AnimPill
          key={i}
          t={t}
          startTime={ROW_TIMES[i]}
          side="right"
          text={text}
          icon={icons.right[i]}
          rowIndex={i}
        />
      ))}
    </div>
  );
}

/* ── ICON DROP ZONE ─────────────────────────────────────────────────────── */
function IconDrop({ icon, onDrop, color }) {
  const [drag, setDrag] = React.useState(false);
  const fileRef = React.useRef();

  const readSvg = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => onDrop(ev.target.result);
    reader.readAsText(file);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setDrag(false);
    readSvg(e.dataTransfer.files[0]);
  };

  return (
    <div
      onDragOver={e => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={handleDrop}
      onClick={() => fileRef.current.click()}
      title="Drop SVG or click to browse"
      style={{
        width: 48, height: 48, borderRadius: '50%',
        background: color,
        border: drag ? '3px dashed rgba(255,255,255,0.9)' : '3px solid transparent',
        cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        flexShrink: 0,
        outline: drag ? `3px solid ${color}` : 'none',
        transition: 'outline 0.15s',
        position: 'relative',
        overflow: 'hidden',
      }}
    >
      {icon
        ? <div style={{ width: '65%', height: '65%', pointerEvents: 'none' }} dangerouslySetInnerHTML={{ __html: icon }} />
        : <span style={{ fontSize: 8.5, color: 'rgba(255,255,255,0.8)', textAlign: 'center', lineHeight: 1.3, fontFamily: 'sans-serif', fontWeight: 600 }}>DROP<br/>SVG</span>
      }
      <input
        ref={fileRef}
        type="file"
        accept=".svg,image/svg+xml"
        style={{ display: 'none' }}
        onChange={e => readSvg(e.target.files[0])}
      />
    </div>
  );
}

/* ── TWEAKS PANEL ───────────────────────────────────────────────────────── */
function TweaksPanel({ config, setConfig, icons, setIcons }) {
  const update = (key, val) => setConfig(c => ({ ...c, [key]: val }));
  const setLeftIcon  = (i, v) => setIcons(ic => { const l = [...ic.left];  l[i] = v; return { ...ic, left: l };  });
  const setRightIcon = (i, v) => setIcons(ic => { const r = [...ic.right]; r[i] = v; return { ...ic, right: r }; });

  const panel = {
    position: 'fixed', bottom: 20, right: 20,
    width: 380, maxHeight: '88vh', overflowY: 'auto',
    background: '#12122a',
    borderRadius: 18,
    padding: '18px 20px',
    zIndex: 9999,
    boxShadow: '0 24px 64px rgba(0,0,0,0.8)',
    border: '1px solid rgba(255,255,255,0.1)',
    fontFamily: 'sans-serif',
  };

  const inp = {
    width: '100%',
    background: 'rgba(255,255,255,0.07)',
    border: '1px solid rgba(255,255,255,0.14)',
    borderRadius: 8,
    padding: '8px 11px',
    color: '#fff',
    fontSize: 13,
    marginBottom: 10,
  };

  const lbl = { fontSize: 10, color: '#888', marginBottom: 3, display: 'block', textTransform: 'uppercase', letterSpacing: '0.6px' };
  const sec = { marginBottom: 20 };
  const hd  = { fontSize: 13, fontWeight: 700, color: '#eee', marginBottom: 12, paddingBottom: 8, borderBottom: '1px solid rgba(255,255,255,0.08)' };

  return (
    <div style={panel}>
      <div style={{ fontWeight: 700, fontSize: 15, color: '#fff', marginBottom: 16, letterSpacing: '-0.3px' }}>
        ✦ Tweaks
      </div>

      {/* Titles */}
      <div style={sec}>
        <div style={hd}>Group Titles</div>
        <label style={lbl}>Left Title (blue)</label>
        <input style={inp} value={config.group1Title} onChange={e => update('group1Title', e.target.value)} />
        <label style={lbl}>Right Title (pink)</label>
        <input style={inp} value={config.group2Title} onChange={e => update('group2Title', e.target.value)} />
      </div>

      {/* Left pills */}
      <div style={sec}>
        <div style={hd}>Left Pills — Icon + Text</div>
        <div style={{ fontSize: 11, color: '#666', marginBottom: 10, lineHeight: 1.4 }}>
          Drop an SVG onto a circle to set its icon. Click to browse files.
        </div>
        {[0,1,2,3].map(i => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
            <IconDrop icon={icons.left[i]} onDrop={v => setLeftIcon(i, v)} color={LEFT_BLUE} />
            <input
              style={{ ...inp, marginBottom: 0, flex: 1 }}
              value={config[`pill${i+1}`]}
              onChange={e => update(`pill${i+1}`, e.target.value)}
              placeholder={`Text ${i+1}`}
            />
          </div>
        ))}
      </div>

      {/* Right pills */}
      <div style={sec}>
        <div style={hd}>Right Pills — Icon + Text</div>
        <div style={{ fontSize: 11, color: '#666', marginBottom: 10, lineHeight: 1.4 }}>
          Drop an SVG onto a circle to set its icon. Click to browse files.
        </div>
        {[0,1,2,3].map(i => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
            <IconDrop icon={icons.right[i]} onDrop={v => setRightIcon(i, v)} color={RIGHT_PINK} />
            <input
              style={{ ...inp, marginBottom: 0, flex: 1 }}
              value={config[`pill${i+5}`]}
              onChange={e => update(`pill${i+5}`, e.target.value)}
              placeholder={`Text ${i+5}`}
            />
          </div>
        ))}
      </div>

      <div style={{ fontSize: 11, color: '#444', textAlign: 'center', marginTop: 4 }}>
        All changes are saved automatically
      </div>
    </div>
  );
}

/* ── APP ROOT ───────────────────────────────────────────────────────────── */
function App() {
  const [config, setConfig] = React.useState(() => {
    try {
      const s = localStorage.getItem('sp_config');
      return s ? { ...TWEAK_DEFAULTS, ...JSON.parse(s) } : { ...TWEAK_DEFAULTS };
    } catch { return { ...TWEAK_DEFAULTS }; }
  });

  const [icons, setIcons] = React.useState(() => {
    try {
      const s = localStorage.getItem('sp_icons');
      return s ? JSON.parse(s) : { left: [null,null,null,null], right: [null,null,null,null] };
    } catch { return { left: [null,null,null,null], right: [null,null,null,null] }; }
  });

  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  // Register tweaks toggle with host toolbar
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode')  setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Persist config
  React.useEffect(() => {
    localStorage.setItem('sp_config', JSON.stringify(config));
  }, [config]);

  React.useEffect(() => {
    localStorage.setItem('sp_icons', JSON.stringify(icons));
  }, [icons]);

  return (
    <>
      <Stage width={1920} height={1080} duration={10}>
        <Scene config={config} icons={icons} />
      </Stage>
      {tweaksOpen && (
        <TweaksPanel
          config={config}
          setConfig={setConfig}
          icons={icons}
          setIcons={setIcons}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
