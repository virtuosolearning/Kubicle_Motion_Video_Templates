    // ─── Easing + helpers ────────────────────────────────────────────────────
    const Easing = {
      linear:        t => t,
      easeOutQuad:   t => t * (2 - t),
      easeOutCubic:  t => 1 - Math.pow(1 - t, 3),
      easeInOutCubic:t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
      easeOutBack:   t => {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      },
    };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const animate = ({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeOutCubic }) => t => {
      if (t <= start) return from;
      if (t >= end)   return to;
      return from + (to - from) * ease((t - start) / (end - start));
    };

    const TimelineContext = React.createContext({ time: 0, duration: 10 });
    const useTime = () => React.useContext(TimelineContext).time;

    // ─── Stage ───────────────────────────────────────────────────────────────
    function Stage({ width = 1920, height = 1080, duration = 10, background = '#E6ECF2', children }) {
      const [time, setTime]       = React.useState(0);
      const [playing, setPlaying] = React.useState(true);
      const [scale, setScale]     = React.useState(1);
      const stageRef = React.useRef(null);
      const rafRef   = React.useRef(null);
      const lastTs   = React.useRef(null);

      React.useEffect(() => {
        const measure = () => {
          if (!stageRef.current) return;
          const w = stageRef.current.clientWidth;
          const h = stageRef.current.clientHeight - 52;
          setScale(Math.max(0.05, Math.min(w / width, h / height)));
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(stageRef.current);
        window.addEventListener('resize', measure);
        return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
      }, [width, height]);

      React.useEffect(() => {
        if (!playing) { lastTs.current = null; return; }
        const step = (ts) => {
          if (lastTs.current == null) lastTs.current = ts;
          const dt = (ts - lastTs.current) / 1000;
          lastTs.current = ts;
          setTime(t => {
            let next = t + dt;
            if (next >= duration) next = next % duration;
            return next;
          });
          rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
        return () => cancelAnimationFrame(rafRef.current);
      }, [playing, duration]);

      React.useEffect(() => {
        const onKey = (e) => {
          if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
          else if (e.code === 'ArrowLeft')  setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.code === 'ArrowRight') setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.key === '0') setTime(0);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [duration]);

      return (
        <div ref={stageRef} style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', background: '#0a0a0a' }}>
          <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', minHeight: 0 }}>
            <div style={{ width, height, background, position: 'relative', transform: `scale(${scale})`, transformOrigin: 'center', flexShrink: 0, boxShadow: '0 20px 60px rgba(0,0,0,0.4)', overflow: 'hidden' }}>
              <TimelineContext.Provider value={{ time, duration }}>
                {children}
              </TimelineContext.Provider>
            </div>
          </div>
          <PlaybackBar time={time} duration={duration} playing={playing} onPlayPause={() => setPlaying(p => !p)} onReset={() => setTime(0)} onSeek={setTime} />
        </div>
      );
    }

    function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek }) {
      const trackRef = React.useRef(null);
      const [drag, setDrag] = React.useState(false);
      const pct = duration > 0 ? (time / duration) * 100 : 0;
      const fmt = (t) => {
        const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
        return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
      };
      const seek = (e) => {
        const r = trackRef.current.getBoundingClientRect();
        onSeek(clamp((e.clientX - r.left) / r.width, 0, 1) * duration);
      };
      React.useEffect(() => {
        if (!drag) return;
        const up = () => setDrag(false);
        const mv = (e) => seek(e);
        window.addEventListener('mouseup', up); window.addEventListener('mousemove', mv);
        return () => { window.removeEventListener('mouseup', up); window.removeEventListener('mousemove', mv); };
      }, [drag]);
      const btn = { width: 28, height: 28, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:6, color:'#f6f4ef', cursor:'pointer', padding:0 };

          </button>
          <button onClick={onPlayPause} title="Play/pause (space)" style={btn}>
            {playing ? (<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>) : (<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>)}
          </button>
          <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, textAlign:'right' }}>{fmt(time)}</div>
          <div ref={trackRef} onMouseDown={(e)=>{setDrag(true);seek(e);}} style={{ flex:1, height:22, position:'relative', cursor:'pointer', display:'flex', alignItems:'center' }}>
            <div style={{ position:'absolute', left:0, right:0, height:4, background:'rgba(255,255,255,0.12)', borderRadius:2 }}/>
            <div style={{ position:'absolute', left:0, width:`${pct}%`, height:4, background:'#0496FF', borderRadius:2 }}/>
            <div style={{ position:'absolute', left:`${pct}%`, top:'50%', width:12, height:12, marginLeft:-6, marginTop:-6, background:'#fff', borderRadius:6, boxShadow:'0 2px 4px rgba(0,0,0,0.4)' }}/>
          </div>
          <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, color:'rgba(246,244,239,0.55)' }}>{fmt(duration)}</div>
        </div>
      );
    }

    // ─── Icon (recoloured SVG) ───────────────────────────────────────────────
    function Icon({ name, size, accent }) {
      const raw = ICON_SVGS[name] || '';
      const html = raw
        .replace(/fill:#33CCCC/gi, `fill:${accent}`)
        .replace(/<svg\s[^>]*>/, `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}" fill="white">`);
      return <div style={{ width:size, height:size, display:'block' }} dangerouslySetInnerHTML={{ __html: html }} />;
    }

    // ─── Scene geometry ──────────────────────────────────────────────────────
    const ICON_SIZE = 300;
    const ICON_CY   = 600;
    const LEFT_ACCENT  = '#0496FF';
    const RIGHT_ACCENT = '#F865B0';

    const ICON_POS_L = [{ cx: 284,  name: 'rocket' }, { cx: 673,  name: 'award'  }];
    const ICON_POS_R = [{ cx: 1256, name: 'laptop' }, { cx: 1644, name: 'goal'   }];

    const TITLE1_C = { cx: 490,  cy: 348 };
    const TITLE2_C = { cx: 1445, cy: 348 };
    const BOX_CY   = 856;
    const BOX_W    = 354;

    // ─── Timings ─────────────────────────────────────────────────────────────
    const ENTRY_START = 0.20;
    const ENTRY_END   = 3.20;

    const FADE_DUR   = 0.50;
    const PULSE_DUR  = 0.70;
    const OPACITY_DUR = 0.35;

    const TITLE1_FADE_START = 3.30;
    const TITLE2_FADE_START = 5.40;
    const PAIR_STARTS = [3.80, 4.60, 5.95, 6.75]; // rocket, award, laptop, goal

    // ─── CenteredText ────────────────────────────────────────────────────────
    function CenteredText({ cx, cy, text, size, weight, font, color = '#000', maxWidth, opacity = 1 }) {
      return (
        <div style={{
          position: 'absolute',
          left: cx - (maxWidth ? maxWidth / 2 : 0),
          top:  cy,
          transform: 'translateY(-50%)',
          width: maxWidth,
          display:'flex', alignItems:'center', justifyContent:'center',
          fontFamily: font, fontWeight: weight, fontSize: size,
          color, letterSpacing: '-0.01em', whiteSpace: 'nowrap',
          textAlign: 'center', pointerEvents: 'none',
          opacity,
        }}>
          {text}
        </div>
      );
    }

    // ─── Reveal wrappers ─────────────────────────────────────────────────────
    function FadeIn({ startTime, duration = FADE_DUR, children }) {
      const t = useTime();
      const opacity = animate({ from: 0, to: 1, start: startTime, end: startTime + duration })(t);
      return <div style={{ position:'absolute', inset:0, opacity, pointerEvents:'none' }}>{children}</div>;
    }

    function IconPulse({ name, accent, cx, cy, size, startTime }) {
      const t = useTime();
      if (t < startTime - 0.001) return null;
      const p       = clamp((t - startTime) / PULSE_DUR, 0, 1);
      const scale   = Easing.easeOutBack(p);                       // 0 → peak(~1.10) → 1
      const opacity = clamp((t - startTime) / OPACITY_DUR, 0, 1);
      return (
        <div style={{
          position:'absolute',
          left: cx - size / 2,
          top:  cy - size / 2,
          width: size, height: size,
          opacity,
          transform: `scale(${scale})`,
          transformOrigin: 'center center',
          pointerEvents: 'none',
        }}>
          <Icon name={name} size={size} accent={accent} />
        </div>
      );
    }

    // ─── Container group — everything that slides (base, title bar, white boxes) ─
    // The white label boxes are attached to the container and stay stationary
    // after the slide. Only the icons and the text are revealed separately.
    function ContainerGroup({ side, translateY }) {
      const isLeft = side === 'left';
      const basePng   = isLeft ? 'Assets/Base_1.png'            : 'Assets/Base_2.png';
      const boxesPng  = isLeft ? 'Assets/Base_1_two_boxes.png'  : 'Assets/Base_2_two_boxes.png';
      const titlePng  = isLeft ? 'Assets/Title1_Box.png'        : 'Assets/Title2_Box.png';
      const groupStyle = { position:'absolute', left:0, top:0, width:1920, height:1080, transform:`translateY(${translateY}px)`, willChange:'transform' };
      const s = { position:'absolute', left:0, top:0, width:1920, height:1080, pointerEvents:'none', display:'block' };
      return (
        <div style={groupStyle}>
          <img src={basePng}  style={s} alt="" />
          <img src={titlePng} style={s} alt="" />
          <img src={boxesPng} style={s} alt="" />
        </div>
      );
    }

    // ─── Scene ───────────────────────────────────────────────────────────────
    function Scene() {
      const t = useTime();
      const leftTY  = animate({ from:  1080, to: 0, start: ENTRY_START, end: ENTRY_END, ease: Easing.easeOutCubic })(t);
      const rightTY = animate({ from: -1080, to: 0, start: ENTRY_START, end: ENTRY_END, ease: Easing.easeOutCubic })(t);

      const titleFont = "'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif";
      const boxFont   = "'Satoshi', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif";

      return (
        <div style={{ position:'absolute', inset:0, background:'#E6ECF2', overflow:'hidden' }}>
          {/* 1) Containers slide in — navy bases + coloured title bars + white boxes (stationary after slide) */}
          <ContainerGroup side="left"  translateY={leftTY}  />
          <ContainerGroup side="right" translateY={rightTY} />

          {/* 2) Title 1 text fades in */}
          <FadeIn startTime={TITLE1_FADE_START}>
            <CenteredText
              cx={TITLE1_C.cx} cy={TITLE1_C.cy}
              text="Title 1 (Edit)" size={55.5} weight={800}
              font={titleFont} maxWidth={800}
            />
          </FadeIn>

          {/* 3) Pair 1 — Rocket pulses, Box 1 text fades in */}
          <IconPulse name="rocket" accent={LEFT_ACCENT}
                     cx={ICON_POS_L[0].cx} cy={ICON_CY} size={ICON_SIZE}
                     startTime={PAIR_STARTS[0]} />
          <FadeIn startTime={PAIR_STARTS[0]}>
            <CenteredText cx={ICON_POS_L[0].cx} cy={BOX_CY} text="Box 1"
                          size={37} weight={700} font={boxFont} maxWidth={BOX_W} />
          </FadeIn>

          {/* 4) Pair 2 — Award pulses, Box 2 text fades in */}
          <IconPulse name="award" accent={LEFT_ACCENT}
                     cx={ICON_POS_L[1].cx} cy={ICON_CY} size={ICON_SIZE}
                     startTime={PAIR_STARTS[1]} />
          <FadeIn startTime={PAIR_STARTS[1]}>
            <CenteredText cx={ICON_POS_L[1].cx} cy={BOX_CY} text="Box 2"
                          size={37} weight={700} font={boxFont} maxWidth={BOX_W} />
          </FadeIn>

          {/* 5) Title 2 text fades in */}
          <FadeIn startTime={TITLE2_FADE_START}>
            <CenteredText
              cx={TITLE2_C.cx} cy={TITLE2_C.cy}
              text="Title 2 (Edit)" size={55.5} weight={800}
              font={titleFont} maxWidth={800}
            />
          </FadeIn>

          {/* 6) Pair 3 — Laptop pulses, Box 3 text fades in */}
          <IconPulse name="laptop" accent={RIGHT_ACCENT}
                     cx={ICON_POS_R[0].cx} cy={ICON_CY} size={ICON_SIZE}
                     startTime={PAIR_STARTS[2]} />
          <FadeIn startTime={PAIR_STARTS[2]}>
            <CenteredText cx={ICON_POS_R[0].cx} cy={BOX_CY} text="Box 3"
                          size={37} weight={700} font={boxFont} maxWidth={BOX_W} />
          </FadeIn>

          {/* 7) Pair 4 — Goal pulses, Box 4 text fades in */}
          <IconPulse name="goal" accent={RIGHT_ACCENT}
                     cx={ICON_POS_R[1].cx} cy={ICON_CY} size={ICON_SIZE}
                     startTime={PAIR_STARTS[3]} />
          <FadeIn startTime={PAIR_STARTS[3]}>
            <CenteredText cx={ICON_POS_R[1].cx} cy={BOX_CY} text="Box 4"
                          size={37} weight={700} font={boxFont} maxWidth={BOX_W} />
          </FadeIn>
        </div>
      );
    }

    function App() {
      return (
        <Stage width={1920} height={1080} duration={10} background="#E6ECF2">
          <Scene />
        </Stage>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
