    // ===========================================================
    // HERO_ICON — change this to swap the big left-side icon.
    // Any filename from /Icon Library/ (without the .svg extension).
    // The final comp shows a globe which isn't in the library,
    // so 'strategy' is used here as a placeholder.
    // ===========================================================
    const HERO_ICON = 'strategy';

    // ─── Easing + helpers ────────────────────────────────────────────────────
    const Easing = {
      linear:        t => t,
      easeOutQuad:   t => t * (2 - t),
      easeOutCubic:  t => 1 - Math.pow(1 - t, 3),
      easeInOutCubic:t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
      easeOutBack:   t => {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      },
    };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const animate = ({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeOutCubic }) => t => {
      if (t <= start) return from;
      if (t >= end)   return to;
      return from + (to - from) * ease((t - start) / (end - start));
    };

    const TimelineContext = React.createContext({ time: 0, duration: 10 });
    const useTime = () => React.useContext(TimelineContext).time;

    // ─── Stage ───────────────────────────────────────────────────────────────
    function Stage({ width = 1920, height = 1080, duration = 10, background = '#E6ECF2', children }) {
      const [time, setTime]       = React.useState(0);
      const [playing, setPlaying] = React.useState(true);
      const [scale, setScale]     = React.useState(1);
      const stageRef = React.useRef(null);
      const rafRef   = React.useRef(null);
      const lastTs   = React.useRef(null);

      React.useEffect(() => {
        const measure = () => {
          if (!stageRef.current) return;
          const w = stageRef.current.clientWidth;
          const h = stageRef.current.clientHeight - 52;
          setScale(Math.max(0.05, Math.min(w / width, h / height)));
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(stageRef.current);
        window.addEventListener('resize', measure);
        return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
      }, [width, height]);

      React.useEffect(() => {
        if (!playing) { lastTs.current = null; return; }
        const step = (ts) => {
          if (lastTs.current == null) lastTs.current = ts;
          const dt = (ts - lastTs.current) / 1000;
          lastTs.current = ts;
          setTime(t => {
            let next = t + dt;
            if (next >= duration) next = next % duration;
            return next;
          });
          rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
        return () => cancelAnimationFrame(rafRef.current);
      }, [playing, duration]);

      React.useEffect(() => {
        const onKey = (e) => {
          if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
          else if (e.code === 'ArrowLeft')  setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.code === 'ArrowRight') setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
          else if (e.key === '0') setTime(0);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [duration]);

      return (
        <div ref={stageRef} style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', background: '#0a0a0a' }}>
          <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', minHeight: 0 }}>
            <div style={{ width, height, background, position: 'relative', transform: `scale(${scale})`, transformOrigin: 'center', flexShrink: 0, boxShadow: '0 20px 60px rgba(0,0,0,0.4)', overflow: 'hidden' }}>
              <TimelineContext.Provider value={{ time, duration }}>
                {children}
              </TimelineContext.Provider>
            </div>
          </div>
          <PlaybackBar time={time} duration={duration} playing={playing} onPlayPause={() => setPlaying(p => !p)} onReset={() => setTime(0)} onSeek={setTime} />
        </div>
      );
    }

    function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek }) {
      const trackRef = React.useRef(null);
      const [drag, setDrag] = React.useState(false);
      const pct = duration > 0 ? (time / duration) * 100 : 0;
      const fmt = (t) => {
        const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
        return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
      };
      const seek = (e) => {
        const r = trackRef.current.getBoundingClientRect();
        onSeek(clamp((e.clientX - r.left) / r.width, 0, 1) * duration);
      };
      React.useEffect(() => {
        if (!drag) return;
        const up = () => setDrag(false);
        const mv = (e) => seek(e);
        window.addEventListener('mouseup', up); window.addEventListener('mousemove', mv);
        return () => { window.removeEventListener('mouseup', up); window.removeEventListener('mousemove', mv); };
      }, [drag]);
      const btn = { width: 28, height: 28, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:6, color:'#f6f4ef', cursor:'pointer', padding:0 };
      const mono = 'ui-monospace, SFMono-Regular, monospace';
      return (
        <div style={{ display:'flex', alignItems:'center', gap:12, padding:'8px 16px', background:'rgba(20,20,20,0.92)', borderTop:'1px solid rgba(255,255,255,0.08)', width:'100%', maxWidth:680, alignSelf:'center', borderRadius:8, color:'#f6f4ef', fontFamily:'Inter,system-ui,sans-serif', userSelect:'none', flexShrink:0 }}>
          <button onClick={onReset} title="Return to start" style={btn}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/></svg>
          </button>
          <button onClick={onPlayPause} title="Play/pause (space)" style={btn}>
            {playing ? (<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>) : (<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>)}
          </button>
          <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, textAlign:'right' }}>{fmt(time)}</div>
          <div ref={trackRef} onMouseDown={(e)=>{setDrag(true);seek(e);}} style={{ flex:1, height:22, position:'relative', cursor:'pointer', display:'flex', alignItems:'center' }}>
            <div style={{ position:'absolute', left:0, right:0, height:4, background:'rgba(255,255,255,0.12)', borderRadius:2 }}/>
            <div style={{ position:'absolute', left:0, width:`${pct}%`, height:4, background:'#0496FF', borderRadius:2 }}/>
            <div style={{ position:'absolute', left:`${pct}%`, top:'50%', width:12, height:12, marginLeft:-6, marginTop:-6, background:'#fff', borderRadius:6, boxShadow:'0 2px 4px rgba(0,0,0,0.4)' }}/>
          </div>
          <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, color:'rgba(246,244,239,0.55)' }}>{fmt(duration)}</div>
        </div>
      );
    }

    // ─── Hero Icon (inline SVG; already Oxford+Dodger coloured in library) ───
    function HeroIcon({ size }) {
      const raw = ICON_SVGS[HERO_ICON] || '';
      const html = raw.replace(/<svg\s[^>]*>/, `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}" fill="#052438">`);
      return <div style={{ width:size, height:size, display:'block' }} dangerouslySetInnerHTML={{ __html: html }} />;
    }

    // ─── Geometry (measured from 1920×1080 assets) ───────────────────────────
    // Pill_Base.png   : pill at x=845..1738 (w=894, h=112), centre (1291, 272)
    // Pill_Circle.png : white circle at x=861..951 (w=91),  centre (906, 271)
    // Tick.png        : tick at x=884..930 (w=47, h=34),    centre (907, 276)
    const PILL_LEFT   = 845;
    const PILL_RIGHT  = 1738;
    const PILL_TOP    = 217;
    const PILL_H      = 112;
    const PILL_WIDTH  = 893;     // PILL_RIGHT - PILL_LEFT
    const CIRCLE_CX   = 906;
    const CIRCLE_CY   = 271;
    const CIRCLE_R    = 45;      // half of 91

    // 5 rows, 142 pixels apart. First row's top lands at y=200.
    const FIRST_PILL_TOP = 200;
    const ROW_PITCH      = 142;
    const rowOffsetY     = (n) => (FIRST_PILL_TOP + n * ROW_PITCH) - PILL_TOP;

    // Hero icon position — left 40% of screen.
    const HERO_SIZE = 520;
    const HERO_CX   = 425;
    const HERO_CY   = 540;

    // Responsibility text
    const TEXT_LEFT = 985;   // just to the right of the white circle
    const TEXT_CY   = 273;   // baseline-y (source frame)

    // ─── Timings ─────────────────────────────────────────────────────────────
    const PH1_START = 0.00, PH1_END = 1.00;                  // hero fade (slowed)
    // Pills (and their white circles) fade up from below, staggered top → bottom.
    const PILL_FADE_DUR     = 0.80;
    const PILL_FADE_STAGGER = 0.15;
    const PILL_FADE_START   = (n) => 1.20 + n * PILL_FADE_STAGGER;
    const PILL_FADE_UP_PX   = 60;
    const ROW_START         = (n) => 2.70 + n * 1.70;        // 1.70s per row (matches slide+text)
    const CIRCLE_SLIDE_DUR = 1.20;                           // slide-across slowed (was 0.80)
    const TICK_TRIM_DUR    = 0.70;                           // tick reveal slowed to match
    const TEXT_FADE_DUR    = 0.50;

    // ─── Pill row ────────────────────────────────────────────────────────────
    function PillRow({ index }) {
      const t = useTime();
      const oy = rowOffsetY(index);
      const rowStart = ROW_START(index);

      // Phase 2 — pills fade up from below, staggered (pill 1 first, then 2, …).
      const pillFadeStart = PILL_FADE_START(index);
      const fadeUpP       = clamp((t - pillFadeStart) / PILL_FADE_DUR, 0, 1);
      const fadeUpEased   = Easing.easeOutCubic(fadeUpP);
      const pillTY        = (1 - fadeUpEased) * PILL_FADE_UP_PX;
      const pillOpacity   = fadeUpEased;

      // White circle: visible from when its pill begins fading up, riding the
      // same fade-up (translateY + opacity). It sits inset from the pill's
      // right edge until row-time, then slides across to the left anchor.
      const CIRCLE_RIGHT_INSET = 18;  // px gap from pill's right edge
      const circleSlide = clamp((t - rowStart) / CIRCLE_SLIDE_DUR, 0, 1);
      const startDx    = (PILL_RIGHT - CIRCLE_R - CIRCLE_RIGHT_INSET) - CIRCLE_CX;
      const currentDx  = startDx * (1 - Easing.easeOutCubic(circleSlide));
      const showCircle = t >= pillFadeStart - 0.001;

      // Tick trim — reveal left→right once circle has mostly landed
      const tickStart = rowStart + 0.85;
      const tickP     = clamp((t - tickStart) / TICK_TRIM_DUR, 0, 1);
      const tickReveal = Easing.easeOutCubic(tickP);
      const TICK_LEFT  = 884;
      const TICK_WIDTH = 47;
      const tickRightInset     = (1 - tickReveal) * TICK_WIDTH;
      const tickCanvasRightBg  = 1920 - (TICK_LEFT + TICK_WIDTH);
      const tickShow = tickReveal > 0;

      // Text fade begins when circle lands
      const textStart = rowStart + CIRCLE_SLIDE_DUR;
      const textOpacity = animate({ from: 0, to: 1, start: textStart, end: textStart + TEXT_FADE_DUR })(t);

      const fullAssetStyle = {
        position: 'absolute', left: 0, top: 0,
        width: 1920, height: 1080,
        display: 'block', pointerEvents: 'none',
      };

      return (
        <div style={{
          position: 'absolute', left: 0, top: 0, width: 1920, height: 1080,
          transform: `translateY(${oy}px)`,
          pointerEvents: 'none',
        }}>
          {/* Pill base — fades up from below */}
          <div style={{
            position: 'absolute', inset: 0,
            transform: `translateY(${pillTY}px)`,
            opacity: pillOpacity,
          }}>
            <img src="Assets/Pill_Base.png" alt="" style={fullAssetStyle} />
          </div>

          {/* White circle (+ tick) — fades up with its pill, sits at the pill's
              right edge until row-time, then slides left to the anchor */}
          {showCircle && (
            <div style={{
              position: 'absolute', inset: 0,
              transform: `translate(${currentDx}px, ${pillTY}px)`,
              opacity: pillOpacity,
            }}>
              <img src="Assets/Pill_Circle.png" alt="" style={fullAssetStyle} />
              {/* Tick — clip-path trim reveal left→right */}
              {tickShow && (
                <div style={{
                  position: 'absolute', inset: 0,
                  clipPath: `inset(0 ${tickCanvasRightBg + tickRightInset}px 0 ${TICK_LEFT}px)`,
                }}>
                  <img src="Assets/Tick.png" alt="" style={fullAssetStyle} />
                </div>
              )}
            </div>
          )}

          {/* Responsibility text — fades in as the circle anchors */}
          <div style={{
            position: 'absolute',
            left: TEXT_LEFT,
            top:  TEXT_CY,
            transform: 'translateY(-50%)',
            fontFamily: "'Satoshi', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif",
            fontWeight: 700,
            fontSize: 37,
            color: '#FFFFFF',
            letterSpacing: '-0.01em',
            whiteSpace: 'nowrap',
            opacity: textOpacity,
            pointerEvents: 'none',
          }}>
            {`Responsibility ${index + 1}`}
          </div>
        </div>
      );
    }

    // ─── Scene ───────────────────────────────────────────────────────────────
    function Scene() {
      const t = useTime();
      const heroOpacity = animate({ from: 0, to: 1, start: PH1_START, end: PH1_END })(t);

      return (
        <div style={{ position: 'absolute', inset: 0, background: '#E6ECF2', overflow: 'hidden' }}>
          {/* Phase 1 — hero icon fades in */}
          <div style={{
            position: 'absolute',
            left: HERO_CX - HERO_SIZE / 2,
            top:  HERO_CY - HERO_SIZE / 2,
            width: HERO_SIZE, height: HERO_SIZE,
            opacity: heroOpacity,
            pointerEvents: 'none',
          }}>
            <HeroIcon size={HERO_SIZE} />
          </div>

          {/* Phases 2 + 3 — pill rows */}
          {[0, 1, 2, 3, 4].map(i => <PillRow key={i} index={i} />)}
        </div>
      );
    }

    function App() {
      return (
        <Stage width={1920} height={1080} duration={12} background="#E6ECF2">
          <Scene />
        </Stage>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
