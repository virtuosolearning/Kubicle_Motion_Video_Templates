<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lesson Goal — 10s</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet">

<style>
  :root {
    --platinum: #E6ECF2;
    --dodger: #0496FF;
    --ink: #0B1F33;

    /* Tweakable — overridden at runtime from TWEAK_DEFAULTS */
    --head-size: 140px;
    --sub-size: 72px;
    --speed: 1;        /* multiplier on animation durations (higher = faster) */

    /* Tweakable start delay — added to every timeline entry */
    --start-delay: 0s;

    /* 10s reference timeline; delays divide by --speed so faster speed shifts timings earlier */
    --t-stripe: calc(var(--start-delay) + 0.25s / var(--speed));
    --t-head:   calc(var(--start-delay) + 0.95s / var(--speed));
    --t-sub:    calc(var(--start-delay) + 1.45s / var(--speed));
    --t-out:    calc(var(--start-delay) + 8.90s / var(--speed));

    --d-stripe: calc(1.40s / var(--speed));
    --d-rise:   calc(0.85s / var(--speed));
    --d-out:    calc(1.10s / var(--speed));
  }

  html, body { margin: 0; padding: 0; background: var(--platinum); overflow: hidden; height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; }

  /* Stage fills the viewport in Platinum Blue so the scaled canvas blends
     into its surroundings — no black letterbox frames. The canvas itself is
     absolutely centred with translate(-50%,-50%) and the fit-scale is applied
     on the same transform, which keeps it visually centred regardless of
     viewport aspect ratio. */
  .stage {
    position: fixed; inset: 0;
    background: var(--platinum);
    overflow: hidden;
  }
  .canvas {
    position: absolute;
    left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    background: var(--platinum);
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,.18);
  }

  /* Stripe hero graphic — sweeps up from off-screen bottom-left */
  .stripe {
    position: absolute; inset: 0;
    background: url("assets/Lesson_Goal_Stripe.png") center/cover no-repeat;
    opacity: 0;
    transform: translate(-60%, 110%) scale(1.05);
    animation:
      stripeReveal var(--d-stripe) cubic-bezier(.2,.8,.2,1) var(--t-stripe) forwards,
      outgoing var(--d-out) ease-in var(--t-out) forwards;
  }
  @keyframes stripeReveal {
    0%   { opacity: 0; transform: translate(-60%, 110%) scale(1.05); }
    15%  { opacity: 1; }
    100% { opacity: 1; transform: translate(0, 0) scale(1); }
  }

  .content {
    position: absolute;
    left: 7%;
    top: 50%;
    transform: translateY(-50%);
    max-width: 55%;
  }

  h1.heading {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: var(--head-size);
    line-height: 1.0;
    color: var(--dodger);
    letter-spacing: -0.03em;
    margin: 0 0 28px;
    opacity: 0;
    transform: translateY(24px);
    animation:
      riseIn var(--d-rise) cubic-bezier(.2,.8,.2,1) var(--t-head) forwards,
      outgoing var(--d-out) ease-in var(--t-out) forwards;
  }

  .subtext {
    font-family: 'Satoshi', 'Inter', sans-serif;
    font-weight: 500;
    font-size: var(--sub-size);
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: -0.015em;
    margin: 0;
    max-width: 1000px;
    text-wrap: pretty;
    opacity: 0;
    transform: translateY(20px);
    animation:
      riseIn var(--d-rise) cubic-bezier(.2,.8,.2,1) var(--t-sub) forwards,
      outgoing var(--d-out) ease-in var(--t-out) forwards;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes outgoing {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  .replay {
    position: fixed; right: 16px; top: 16px; z-index: 10;
    background: rgba(11,31,51,0.8); color: #fff; border: none;
    padding: 10px 16px; font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 600; letter-spacing: 0.05em;
    border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(8px); opacity: 0.65;
    transition: opacity .2s;
  }
  .replay:hover { opacity: 1; }

  /* Tweaks panel */
  .tweaks {
    position: fixed;
    right: 16px; bottom: 16px;
    z-index: 20;
    width: 300px;
    background: rgba(17, 28, 42, 0.92);
    color: #fff;
    border-radius: 14px;
    padding: 18px;
    font-family: 'Inter', system-ui, sans-serif;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    backdrop-filter: blur(12px);
    display: none;
  }
  .tweaks.open { display: block; }
  .tweaks h3 {
    margin: 0 0 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  .tweak-row { margin-bottom: 14px; }
  .tweak-row:last-child { margin-bottom: 0; }
  .tweak-row label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; font-weight: 600;
    margin-bottom: 6px;
    color: rgba(255,255,255,0.85);
  }
  .tweak-row label .val {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: #69c1ff;
    font-weight: 500;
  }
  .tweak-row input[type="range"] {
    width: 100%; margin: 0;
    accent-color: #0496FF;
  }
  .tweak-row button.reset {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
  }
  .tweak-row button.reset:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="canvas" id="canvas">
    <div class="stripe" aria-hidden="true"></div>
    <div class="content">
      <h1 class="heading">Lesson Goal</h1>
      <p class="subtext">Paste Lesson Goal</p>
    </div>
  </div>
</div>

<button class="replay" id="replay">↻ Replay</button>

<!-- Tweaks panel -->
<div class="tweaks" id="tweaks">
  <h3>Tweaks</h3>
  <div class="tweak-row">
    <label>Heading size <span class="val" id="v-head">140px</span></label>
    <input type="range" id="tw-head" min="60" max="220" step="2" />
  </div>
  <div class="tweak-row">
    <label>Subtext size <span class="val" id="v-sub">72px</span></label>
    <input type="range" id="tw-sub" min="30" max="140" step="1" />
  </div>
  <div class="tweak-row">
    <label>Animation speed <span class="val" id="v-speed">1.00×</span></label>
    <input type="range" id="tw-speed" min="0.25" max="3" step="0.05" />
  </div>
  <div class="tweak-row">
    <label>Start delay <span class="val" id="v-start">0.0s</span></label>
    <input type="range" id="tw-start" min="0" max="5" step="0.1" />
  </div>
  <div class="tweak-row">
    <button class="reset" id="tw-reset">Reset to defaults</button>
  </div>
</div>

<script>
  // --- Persisted defaults (edited by the host on disk) ---
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "headSize": 116,
    "subSize": 72,
    "speed": 0.6,
    "startDelay": 0.4
  }/*EDITMODE-END*/;

  const state = { ...TWEAK_DEFAULTS };

  function applyState() {
    const root = document.documentElement;
    root.style.setProperty('--head-size', state.headSize + 'px');
    root.style.setProperty('--sub-size', state.subSize + 'px');
    root.style.setProperty('--speed', String(state.speed));
    root.style.setProperty('--start-delay', state.startDelay + 's');
    document.getElementById('v-head').textContent = state.headSize + 'px';
    document.getElementById('v-sub').textContent = state.subSize + 'px';
    document.getElementById('v-speed').textContent = state.speed.toFixed(2) + '×';
    document.getElementById('v-start').textContent = state.startDelay.toFixed(1) + 's';
    document.getElementById('tw-head').value = state.headSize;
    document.getElementById('tw-sub').value = state.subSize;
    document.getElementById('tw-speed').value = state.speed;
    document.getElementById('tw-start').value = state.startDelay;
  }
  applyState();

  // --- Canvas scaling ---
  // The CSS centres the canvas with translate(-50%,-50%); we keep that part
  // of the transform and only update the scale here, so the canvas stays
  // visually centred whatever the viewport size.
  const canvas = document.getElementById('canvas');
  function fit() {
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  fit();
  window.addEventListener('resize', fit);

  // --- Replay (also replays whenever a tweak changes so you can see the effect) ---
  function replay() {
    const current = document.getElementById('canvas');
    if (!current) return;
    const clone = current.cloneNode(true);
    clone.id = 'canvas';
    current.replaceWith(clone);
    fit();
  }
  document.getElementById('replay').addEventListener('click', replay);

  // Auto-loop at the current (speed-adjusted) scene length
  let loopId = null;
  function scheduleLoop() {
    if (loopId) clearInterval(loopId);
    const sceneMs = 10000 / state.speed;
    loopId = setInterval(replay, sceneMs);
  }
  scheduleLoop();

  // --- Edit-mode protocol ---
  function persist() {
    try {
      window.parent.postMessage({
        type: '__edit_mode_set_keys',
        edits: { headSize: state.headSize, subSize: state.subSize, speed: state.speed, startDelay: state.startDelay }
      }, '*');
    } catch (e) {}
  }

  window.addEventListener('message', (e) => {
    const d = e && e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === '__activate_edit_mode') {
      document.getElementById('tweaks').classList.add('open');
    } else if (d.type === '__deactivate_edit_mode') {
      document.getElementById('tweaks').classList.remove('open');
    }
  });

  // Tweak listeners
  function bindRange(id, key, parser, afterLoop) {
    const el = document.getElementById(id);
    el.addEventListener('input', () => {
      state[key] = parser(el.value);
      applyState();
      replay();
      if (afterLoop) scheduleLoop();
    });
    el.addEventListener('change', persist);
  }
  bindRange('tw-head', 'headSize', v => parseInt(v, 10));
  bindRange('tw-sub',  'subSize',  v => parseInt(v, 10));
  bindRange('tw-speed','speed',      v => parseFloat(v), true);
  bindRange('tw-start','startDelay', v => parseFloat(v));

  document.getElementById('tw-reset').addEventListener('click', () => {
    Object.assign(state, TWEAK_DEFAULTS);
    applyState();
    scheduleLoop();
    replay();
    persist();
  });

  // Announce availability AFTER the listener above is registered
  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch (e) {}
</script>

</body>
</html>
